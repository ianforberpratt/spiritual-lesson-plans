<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:F;font-weight:400;src:url(node_modules/@fontsource/fraunces/files/fraunces-latin-400-normal.woff2)}
@font-face{font-family:F;font-weight:400;font-style:italic;src:url(node_modules/@fontsource/fraunces/files/fraunces-latin-400-italic.woff2)}
@font-face{font-family:F;font-weight:700;src:url(node_modules/@fontsource/fraunces/files/fraunces-latin-700-normal.woff2)}
@font-face{font-family:F;font-weight:700;font-style:italic;src:url(node_modules/@fontsource/fraunces/files/fraunces-latin-700-italic.woff2)}
@font-face{font-family:I;font-weight:600;src:url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
html,body{margin:0;background:#FBF5EA}
#s{position:relative;width:1280px;height:720px;overflow:hidden;font-family:F,Georgia,serif}
.sh{position:absolute;border-radius:50%}
.ln{position:absolute;left:0;width:1280px;text-align:center;white-space:nowrap;line-height:1.05}
.w{display:inline-block;white-space:nowrap}
.l{display:inline-block;will-change:transform}
.sm{font-family:I,sans-serif;font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:20px}
svg{position:absolute;left:0;bottom:0}
</style><div id="s"></div>
<script>
const C={cream:'#FBF5EA',gold:'#E8A94C',deep:'#CE8F34',sky:'#A9C9D9',sage:'#8CA37E',ink:'#362F4B'};
const S=document.getElementById('s');
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-x,3), eb=x=>{const c=1.5,d=c+1;return 1+d*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
// scenes: bg, lines[{parts:[[text,color,style]],y,size,dy}]
const sc=[
 {a:0,b:3.6,bg:C.cream,L:[{p:[['You have the ',C.ink,'']],y:250,z:70},{p:[['faith.',C.deep,'italic']],y:330,z:150}]},
 {a:3.6,b:7.2,bg:C.cream,L:[{p:[['You have the ',C.ink,'']],y:250,z:70},{p:[['energy.',C.sage,'italic']],y:330,z:150}]},
 {a:7.2,b:10.8,bg:C.cream,L:[{p:[['You have the ',C.ink,'']],y:250,z:70},{p:[['content.',C.deep,'italic']],y:330,z:150}]},
 {a:10.8,b:16.2,bg:C.sky,water:1,L:[{p:[['And yet, some Sundays you feel',C.ink,'']],y:170,z:52},{p:[['out of water.',C.ink,'italic']],y:250,z:130,bob:1}]},
 {a:16.2,b:20.4,bg:C.ink,L:[{p:[['The ',C.cream,''],['what',C.gold,'italic'],[' is already yours.',C.cream,'']],y:270,z:64},{p:[['Let’s build the ',C.cream,''],['how.',C.gold,'italic']],y:370,z:100}]},
 {a:20.4,b:24.6,bg:C.gold,L:[{p:[['Pedagogy is learnable.',C.ink,'']],y:230,z:84},{p:[['Faith is what you ',C.ink,''],['already',C.cream,'italic'],[' bring.',C.ink,'']],y:340,z:56}]},
 {a:24.6,b:29,bg:C.ink,end:1,L:[{p:[['You’re not behind.',C.cream,'']],y:200,z:76},{p:[['You’re ',C.cream,''],['ready.',C.gold,'italic']],y:290,z:150},{p:[['Spiritual Lesson Plans · For Mentors',C.sky,'sm']],y:520,z:20},{p:[['spirituallessonplans.org/for-mentors',C.cream,'sm']],y:566,z:20}]}
];
const T=29;
// build DOM
const bgd=document.createElement('div');bgd.style.cssText='position:absolute;inset:0';S.appendChild(bgd);
const sun=document.createElement('div');sun.className='sh';S.appendChild(sun);
const ring=document.createElement('div');ring.className='sh';S.appendChild(ring);
const ring2=document.createElement('div');ring2.className='sh';S.appendChild(ring2);
const NS='http://www.w3.org/2000/svg';
const svg=document.createElementNS(NS,'svg');svg.setAttribute('width',1280);svg.setAttribute('height',300);svg.setAttribute('viewBox','0 0 1280 300');
const wp=[0,1,2].map(i=>{const p=document.createElementNS(NS,'path');p.setAttribute('fill',[C.cream,C.sage,C.ink][i]);p.setAttribute('opacity',[.55,.55,.9][i]);svg.appendChild(p);return p});
S.appendChild(svg);
sc.forEach(s=>{s.els=s.L.map(l=>{const d=document.createElement('div');d.className='ln';d.style.top=l.y+'px';d.style.fontSize=l.z+'px';
 l.ls=[];
 l.p.forEach(([t,c,st])=>{t.split(/( )/).forEach(wd=>{if(wd===' '){d.appendChild(document.createTextNode(' '));return}if(!wd)return;
  const w=document.createElement('span');w.className='w';
  [...wd].forEach(ch=>{const e=document.createElement('span');e.className='l';e.textContent=ch;e.style.color=c;
   if(st==='italic'){e.style.fontStyle='italic';e.style.fontWeight=700}else if(st==='sm'){e.classList.add('sm');e.style.fontSize='20px'}else e.style.fontWeight=400;
   w.appendChild(e);l.ls.push(e)});d.appendChild(w)})});
 S.appendChild(d);return d});});
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join()+')'};
function wave(p,t,amp,f,ph,base){let d='M0 300 L0 '+base;for(let x=0;x<=1280;x+=20)d+=' L'+x+' '+(base+Math.sin(x*f+t*ph)*amp);d+=' L1280 300Z';p.setAttribute('d',d)}
function render(t){
 // bg crossfade
 let cur=sc.findIndex(s=>t>=s.a&&t<s.b);if(cur<0)cur=sc.length-1;
 const s=sc[cur],prev=sc[Math.max(0,cur-1)];
 const k=cur>0?eo(cl((t-s.a)/0.6)):1;
 bgd.style.background=mix(prev.bg,s.bg,k);
 // sun: slow rising gold circle
 const u=t/T;
 const dark=s.bg===C.ink;
 sun.style.cssText+=';width:520px;height:520px;background:'+(s.bg===C.gold?C.cream:C.gold)+';opacity:'+(s.bg===C.gold?.35:dark?.5:.22)+';left:'+(1280-(dark?270:380)+Math.sin(t*.4)*20)+'px;top:'+(720-120-u*420+(dark?170:0))+'px;transform:scale('+(1+Math.sin(t*.8)*.03)+')';
 ring.style.cssText+=';width:640px;height:640px;border:2px solid '+(dark?C.sky:C.ink)+';opacity:.14;left:-200px;top:'+(-260+Math.sin(t*.5)*24)+'px';
 ring2.style.cssText+=';width:340px;height:340px;border:2px solid '+(dark?C.gold:C.sage)+';opacity:.35;left:'+(90+Math.cos(t*.6)*16)+'px;top:'+(500+Math.sin(t*.7)*16)+'px';
 // water
 const wv=s.water?eo(cl((t-s.a)/1.2))*(1-eo(cl((t-(s.b-.7))/.7))):0;
 svg.style.opacity=wv>0?1:0;svg.style.transform='translateY('+((1-wv)*260)+'px)';
 wave(wp[0],t,10,.012,2.2,150);wave(wp[1],t,12,.009,-1.7,185);wave(wp[2],t,9,.014,1.3,225);
 // text
 sc.forEach((sn,si)=>{
  const active=t>=sn.a-0.01&&t<sn.b;
  sn.els.forEach((d,li)=>{d.style.display=active?'block':'none';if(!active)return;
   const l=sn.L[li],n=l.ls.length;const off=li*0.55+(sn.L.length>2&&li>1?0.4:0);
   l.ls.forEach((e,i)=>{
    const ti=t-sn.a-0.1-off-i*0.035;
    let a=cl(ti/0.55);let x=eb(a);
    let o=cl(ti/0.3),tx=0,ty=(1-x)*70,rot=(1-x)*(i%2?9:-9),sc2=.6+.4*x;
    if(!sn.end){const to=t-(sn.b-0.5)-i*0.012;const b=eo(cl(to/0.4));o*=1-b;ty-=b*40}
    if(l.bob&&a>=1){ty+=Math.sin(t*2.2+i*.7)*10;rot+=Math.sin(t*1.7+i)*3}
    e.style.opacity=o;e.style.transform='translate('+tx+'px,'+ty+'px) rotate('+rot+'deg) scale('+sc2+')';
   });
  });
 });
 // end fade
 S.style.opacity=t>T-.5?cl((T-t)/.5):1;
}
window.render=render;render(0);
</script>
