<style>
/* Layout: a phone-first, one-task-per-screen guide under a slim dusk bar. Every station follows the same rhythm (Read this, Think about this, Try this, Turn it toward you) so the process is the design. Palette: cream, dusk, gold, sage, sky. */
:root{
  --bg:#F6F0E0;--surface:#FCF9F0;--fg:#2A3150;--muted:#5C6483;--line:#DDD3BA;
  --band:#333E63;--band-fg:#F6F0E0;--gold:#B88A2E;--accent-text:#8A6620;
  --sage:#6F8F6C;--sage-soft:#E3EADD;--sky:#8DB4D2;--sky-soft:#E1EDF5;--gold-soft:#F3E7C8;
  --btn-bg:#333E63;--btn-fg:#F6F0E0;--danger-soft:#F6E3DA;
  --font-display:'Fraunces',Georgia,serif;--font-body:'Literata',Georgia,serif;--font-ui:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D2340;--surface:#262D4D;--fg:#F0E9D6;--muted:#B5BAD0;--line:#3A4268;--band:#161B33;
  --gold:#D9B25A;--accent-text:#E2BE6E;--sage:#9DB899;--sage-soft:#2C3A38;--sky:#8FB3D1;--sky-soft:#28384F;--gold-soft:#3A3524;
  --btn-bg:#D9B25A;--btn-fg:#1D2340;--danger-soft:#4A3030;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D2340;--surface:#262D4D;--fg:#F0E9D6;--muted:#B5BAD0;--line:#3A4268;--band:#161B33;
  --gold:#D9B25A;--accent-text:#E2BE6E;--sage:#9DB899;--sage-soft:#2C3A38;--sky:#8FB3D1;--sky-soft:#28384F;--gold-soft:#3A3524;
  --btn-bg:#D9B25A;--btn-fg:#1D2340;--danger-soft:#4A3030;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:1.06rem;line-height:1.6;margin:0}
.wrap{max-width:36rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2.4rem,11vw,3.4rem);margin-bottom:.6rem}
h2{font-size:1.6rem;margin-bottom:.7rem}
h3{font-size:1.15rem;margin-bottom:.3rem}
h1:focus,h2:focus{outline:none}
p{margin:0 0 1rem}
button{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.label{font-family:var(--font-ui);font-weight:600;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text);display:block;margin-bottom:.4rem}
.muted{color:var(--muted)}

.top{background:var(--band);color:var(--band-fg)}
.top .bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.7rem}
.brand{font-family:var(--font-ui);font-weight:600;letter-spacing:.05em;font-size:.88rem;color:#A9C8E0;white-space:nowrap}
.prog{display:flex;gap:5px;flex:1;max-width:12rem}
.prog i{flex:1;height:6px;border-radius:3px;background:rgba(246,240,224,.28)}
.prog i.on{background:#D9B25A}
.pts{font-family:var(--font-ui);font-weight:600;font-size:.9rem;color:#D9B25A;white-space:nowrap}
@media (max-width:420px){.brand{display:none}}
.ref{font-family:var(--font-ui);font-weight:600;font-size:.85rem;letter-spacing:.06em;color:var(--accent-text);margin:0 0 .25rem}
.scripture{font-size:1.06rem;line-height:1.75;border-left:3px solid var(--sky);padding-left:1rem;margin:0 0 1rem}
.scripture sup{font-family:var(--font-ui);font-weight:600;color:var(--accent-text);font-size:.7rem;margin-right:.15rem}
.pulse{width:64px;height:64px;border-radius:50%;border:4px solid var(--gold);margin:.8rem auto;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.6}50%{transform:scale(1.05);opacity:1}}

main{padding-block:1.6rem 6rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem;margin-bottom:1rem}
.card.sky{background:var(--sky-soft);border-color:transparent}
.card.gold{background:var(--gold-soft);border-color:transparent}
.card.sage{background:var(--sage-soft);border-color:transparent}
.card.alert{background:var(--danger-soft);border-color:transparent}
.card p:last-child{margin-bottom:0}
.card .label{margin-bottom:.25rem}
blockquote{margin:0 0 .8rem;padding:.1rem 0 .1rem 1rem;border-left:3px solid var(--sky)}
blockquote cite{display:block;font-family:var(--font-ui);font-style:normal;font-size:.85rem;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-ui);font-weight:600;font-size:1.05rem;min-height:3.1rem;padding:.6rem 1.4rem;border-radius:12px;border:2px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-fg);cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1rem}

.opt{display:block;width:100%;text-align:left;font-family:var(--font-body);font-size:1.02rem;line-height:1.5;background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:.85rem 1rem;margin-bottom:.6rem;cursor:pointer;min-height:3.2rem}
.opt:hover:not([disabled]){border-color:var(--gold)}
.opt[disabled]{cursor:default;color:var(--fg)}
.opt.best{border-color:var(--sage);background:var(--sage-soft)}
.opt.close{border-color:var(--gold);background:var(--gold-soft)}
.opt .tl{display:block;font-family:var(--font-ui);font-weight:600;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;margin-top:.3rem;color:var(--muted)}
.fb{border-radius:12px;padding:.9rem 1.1rem;margin:.6rem 0 0;background:var(--sky-soft)}
.fb p{margin:0}

.scen{display:block;width:100%;text-align:left;font-family:var(--font-body);background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:14px;padding:.9rem 1.1rem;margin-bottom:.7rem;cursor:pointer}
.scen:hover{border-color:var(--gold)}
.scen b{font-family:var(--font-display);font-size:1.2rem;display:block}
.scen span{font-size:.97rem;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.chip{font-family:var(--font-ui);font-weight:600;font-size:1rem;background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:999px;padding:.5rem 1rem;cursor:pointer;min-height:2.8rem}
.chip[aria-pressed="true"]{border-color:var(--sage);background:var(--sage-soft)}
.chip[aria-pressed="true"]::before{content:"\2713\00a0"}
.chip:hover{border-color:var(--gold)}

label.field{display:block;font-family:var(--font-ui);font-weight:600;margin-bottom:.35rem}
input[type=text],textarea{width:100%;font-family:var(--font-body);font-size:1.05rem;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.7rem .9rem;margin-bottom:1rem}
textarea{min-height:6rem;resize:vertical}

.still{font-family:var(--font-display);font-size:3rem;text-align:center;margin:.6rem 0}
.four{list-style:none;padding:0;margin:0 0 1rem}
.four li{display:flex;gap:.8rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.four li:last-child{border-bottom:none}
.four b{font-family:var(--font-display);min-width:5.2rem}
.big{font-family:var(--font-display);font-size:1.4rem;line-height:1.3;margin:0 0 .6rem}
.steps3{list-style:none;padding:0;margin:0 0 1rem}
.steps3 li{margin-bottom:.5rem}
.steps3 b{font-family:var(--font-ui);letter-spacing:.04em}

.help-btn{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;font-family:var(--font-ui);font-weight:600;font-size:.95rem;background:var(--surface);color:var(--fg);border:2px solid var(--gold);border-radius:999px;padding:.55rem 1.1rem;cursor:pointer;min-height:2.8rem;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.help-panel{position:fixed;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:21;max-width:30rem;margin-inline:auto;background:var(--surface);border:2px solid var(--gold);border-radius:14px;padding:1rem 1.2rem;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.help-panel p{margin:0 0 .6rem}
.help-panel p:last-child{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap bar">
    <span class="brand">spirituallessonplans.org</span>
    <div class="prog" id="prog" aria-hidden="true"></div>
    <span class="pts" id="pts" hidden></span>
  </div>
</header>

<button id="helpBtn" class="help-btn" type="button" aria-expanded="false" aria-controls="helpPanel">Need help now?</button>
<div id="helpPanel" class="help-panel" hidden>
  <p><b>You don't have to carry this alone.</b></p>
  <p>Tell a parent, Ian, or another adult you trust, today.</p>
  <p><b>988</b> · call or text, any hour.</p>
  <p><b>911</b> · if someone is in danger right now.</p>
</div>

<script>
(function(){
var app=document.getElementById('app');
var prog=document.getElementById('prog');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

var ST=[
 {n:'Notice',
  what:"Notice means seeing that something has changed in a friend, and saying what you see, kindly. You describe it. You don't label it, and you don't diagnose.",
  why:"People often hide how they feel because they don't want to be a problem. A warm, specific \"I noticed\" says \"you're seen\" without turning them into a case.",
  verse:"<p class=\"ref\">John 11:32–33</p><p class=\"scripture\"><sup>32</sup> Then when Mary was come where Jesus was, and saw him, she fell down at his feet, saying unto him, Lord, if thou hadst been here, my brother had not died. <sup>33</sup> When Jesus therefore saw her weeping, and the Jews also weeping which came with her, he groaned in the spirit, and was troubled,</p><p class=\"muted\" style=\"margin:0\">Even Jesus felt it. Noticing someone's pain is love, not weakness.</p>",
  think:"When did someone last really notice you? What did it feel like?"},
 {n:'Listen',
  what:"Listening means asking, then waiting. You aren't there to fix anything, and you don't need to have answers.",
  why:"Advice can sound like \"you're doing it wrong.\" A question says \"I want to understand.\" People often find their own next step once they feel heard.",
  verse:"<p class=\"ref\">John 11:34</p><p class=\"scripture\"><sup>34</sup> And said, Where have ye laid him? They said unto him, Lord, come and see.</p><p class=\"ref\">Psalm 116:1–2</p><p class=\"scripture\"><sup>1</sup> I love the Lord, because he hath heard my voice and my supplications. <sup>2</sup> Because he hath inclined his ear unto me, therefore will I call upon him as long as I live.</p><p class=\"muted\" style=\"margin:0\">Listening is how we come and see. And God listens to us, too.</p>",
  think:"When someone listened to you without trying to fix it, what did they do?"},
 {n:'Loosen',
  what:"Loosen means one small, real step that makes the load a little lighter: sitting with them, walking with them, sharing a meal, helping with one small task.",
  why:"Big gestures can overwhelm, and \"think positive\" can feel like being brushed off. A small step shows love in action, and it's one they can say yes to.",
  verse:"<p class=\"ref\">John 11:39, 41</p><p class=\"scripture\"><sup>39</sup> Jesus said, Take ye away the stone. <sup>41</sup> Then they took away the stone from the place where the dead was laid.</p><p class=\"ref\">Science and Health 225:21</p><p class=\"scripture\">Love is the liberator.</p><p class=\"muted\" style=\"margin:0\">Notice who does the moving: the people standing there.</p>",
  think:"What is one small thing someone did for you that mattered more than they knew?"},
 {n:'Loop in',
  what:"Loop in means bringing in a trusted adult or a professional, and staying with your friend while you do. It is never a betrayal.",
  why:"Some things are too big for friends to carry alone, and you don't have to. Lazarus came out \"bound hand and foot,\" and other hands untied him. Asking for help is how help arrives.",
  verse:"<p class=\"ref\">John 11:44</p><p class=\"scripture\"><sup>44</sup> And he that was dead came forth, bound hand and foot with graveclothes: and his face was bound about with a napkin. Jesus saith unto them, Loose him, and let him go.</p><p class=\"ref\">Psalm 116:6, 10</p><p class=\"scripture\"><sup>6</sup> The Lord preserveth the simple: I was brought low, and he helped me. <sup>10</sup> I believed, therefore have I spoken: I was greatly afflicted.</p><p class=\"muted\" style=\"margin:0\">Lazarus came out still bound, and other hands untied him.</p>",
  think:"Which adults in your life could you tell anything? Name them in your head."}
];

var SC=[
 {id:'maya',name:'Maya',story:"Since her family moved over the summer, Maya eats lunch alone and hasn't answered the group chat in weeks.",steps:[
  {q:"Where do you start?",o:["Tell the group chat Maya is being weird.","Say to Maya, 'Hey, I've missed you at lunch. How are you doing?'","Decide she needs space and say nothing."],b:1,w:"Noticing means saying what you see with warmth, not talking about her or ignoring it. 'I've missed you' tells her she matters."},
  {q:"Maya says, 'It's just hard here.' You say:",o:["That sounds really hard. What's been the hardest part?","At least you go to a nice school.","You should just join a club."],b:0,w:"Curiosity replaces correction. A question invites her to say more. Silver linings and quick fixes close the door."},
  {q:"Which small step helps most?",o:["Plan a big party to cheer her up.","Save her a seat at lunch tomorrow and text her where it is.","Tell her to think positive thoughts."],b:1,w:"One small, real step beats a big gesture. A saved seat is an invitation she can say yes to."},
  {q:"Weeks pass, and Maya still seems low and keeps falling asleep in class. What now?",o:["Tell her you care, and ask if she'd talk with a counselor or trusted adult, with you beside her.","Keep waiting. She'll come around.","Tell everyone so they can all help."],b:0,w:"You offer a bridge and you stay. Telling everyone takes away her say in her own story."}
 ]},
 {id:'jordan',name:'Jordan',story:"Jordan's mind races before every test. He says 'I'm fine, just tired,' but he hasn't slept well in weeks.",steps:[
  {q:"He says it again. You:",o:["Say, 'I believe you're tired. I've also noticed you seem on edge before tests. I'm here either way.'","Believe him and move on.","Say, 'You're obviously anxious. You need a doctor.'"],b:0,w:"You can accept his words and still say what you see, without putting a label on him."},
  {q:"He admits his mind races. You:",o:["Tell him to just relax.","Tell him about your own worst test.","Ask, 'What does it feel like? What helps, even a little?'"],b:2,w:"Asking what it's like and what helps lets him lead. 'Just relax' and your own story move the focus off him."},
  {q:"A small step to do together:",o:["Study for twenty minutes, then take a short walk outside.","Quiz him over and over until he feels sure.","Tell him to skip the test and avoid it."],b:0,w:"A steady little routine with a break and fresh air beats more pressure or avoiding."},
  {q:"His sleep still hasn't improved. You:",o:["Tell him to pray harder.","Handle it for him by telling his teachers yourself.","Suggest he talk with a parent or counselor, and offer to be there when he does."],b:2,w:"Prayer is part of this, and so is practical help. He shouldn't have to choose between them. And he stays in charge of his own story."}
 ]},
 {id:'sam',name:'Sam',story:"Sam's grandfather died over the summer. Everyone else seems to have moved on, and Sam jokes about it when it comes up.",steps:[
  {q:"Sam jokes about it again. You:",o:["Laugh along. It's easier.","Say softly, 'I'm still sad about your grandfather too. How are you doing?'","Tell her it might be time to move on."],b:1,w:"Grief has no deadline. You show her it's still okay to talk about him."},
  {q:"She starts telling you about him. You:",o:["Say, 'He's in a better place now.'","Change the subject so she doesn't cry.","Listen, and ask, 'What was he like?'"],b:2,w:"Stories honor people, and tears are okay. You're not there to take the sadness away, just to stay."},
  {q:"A small step:",o:["Send her a long list of tips for feeling better.","Make her promise she'll be fine.","Offer to sit with her at lunch this week, and ask if she'd like to show you photos of him."],b:2,w:"Presence beats performance. A seat beside her and a photo say, 'He mattered, and so do you.'"},
  {q:"Months later, Sam still isn't sleeping or eating much. You:",o:["Tell her it's been long enough.","Stop bringing it up.","Tell her what you've noticed, and suggest she talk with a trusted adult or counselor."],b:2,w:"Some grief needs more help. Naming what you see and offering a bridge is care, not pushing."}
 ]},
 {id:'priya',name:'Priya',story:"After a rough performance, Priya keeps writing 'I'm such a failure lol' in the team chat.",steps:[
  {q:"She posts it again. You:",o:["React with a laughing emoji.","Post, 'Stop saying that!' in the chat.","Message her privately: 'That sounded rough. You're not a failure to me. Want to talk?'"],b:2,w:"A private, warm message names it without putting her on the spot."},
  {q:"She says, 'I mess everything up.' You:",o:["Say, 'That's not true.'","Ask, 'What happened that made it feel that way?'","List everything she's good at."],b:1,w:"Listening first lets her feel heard. Then the true things you say can land."},
  {q:"A small step:",o:["Tell her to try harder next time.","Tell her to stop thinking about it.","Name one true thing about her in your own words, then offer to grab food after practice."],b:2,w:"A specific, true thing plus time together helps more than orders to stop or try harder."},
  {q:"It keeps happening, and she stops enjoying the team. You:",o:["Wait until the season ends.","Encourage her to talk with a coach, counselor, or trusted adult, and offer to go with her.","Tell her the coach won't care."],b:1,w:"You're a bridge. A caring adult can help with what a friend can't carry alone."}
 ]},
 {id:'eli',name:'Eli',heavy:true,story:"Eli quit the band he loved, skips hanging out, and says, 'Nothing really matters anymore.'",steps:[
  {q:"He says it again. You:",o:["Laugh it off.","Say, 'Everything matters. You're being dramatic.'","Say, 'It matters to me that you're here. I'm worried about you.'"],b:2,w:"Take it seriously and say you care. When someone says nothing matters, don't brush it off."},
  {q:"You decide to ask directly. Which is best?",o:["'You're not thinking something stupid, are you?'","'Are you having thoughts of hurting yourself?'","'Do you want to do something crazy?'"],b:1,w:"Asking directly and kindly doesn't plant the idea. It opens the door. The other two sound like judgment."},
  {q:"He says he's just numb and tired. A small step:",o:["Give him a deadline to cheer up.","Leave him alone until he feels better.","Stay with him, send a short text every day, and invite him to one easy thing."],b:2,w:"Steady, small presence tells him he isn't alone, without pressure."},
  {q:"He says yes, sometimes he does think about it, and asks you to keep it secret. You:",o:["Keep the secret. He trusts you.","Post in the group chat so people can check on him.","Tell a trusted adult today, stay with him, and call or text 988 together."],b:2,w:"This is the one secret you don't keep. Telling an adult is loyalty, not betrayal. 988 is call or text, any hour. If he is in danger right now, call 911."}
 ]}
];

var MOODS=[
 {l:'Good',m:"Wonderful. Notice what's helping, so you can pass it on."},
 {l:'Okay',m:"Okay is a real place to be. Thank you for being honest."},
 {l:'A bit heavy',m:"Thank you for saying so. Feeling it isn't failing. Jesus himself was troubled."},
 {l:'Really heavy',heavy:true,m:"Thank you for being honest. You are not a problem to be fixed, and you don't have to carry this alone."},
 {l:'Rather not say',m:"That's completely fine. You don't owe anyone an answer. The rest is here for you anyway."}
];
var SMALL=['Rest or a nap','Water and a meal','A walk outside','Music','Pray or sit quietly','Text a friend','One easy task'];
var LOOK=[
 "What does Jesus do when he sees Mary and the others crying? Does he stay calm and distant, or does he feel it with them?",
 "Who asks the question, and who answers? Notice that the answer is an invitation: come and see. Then notice who is listening in the Psalm.",
 "Who actually moves the stone, Jesus or the people standing there? Notice what the stone was blocking.",
 "What is still on Lazarus when he walks out? Who is told to help, and what does the psalmist say about speaking up?"
];
var CREWS=['The Untied Kingdom','The Knot Ninjas','The Stone Rollers','The Bracelet Bandits','The Open Door Crew','The Sidekick Society'];
var GATES=[
 {word:'banana',badge:null,silly:"Sky-write it! With your whole arm, write \"Loose him\" in the air in the biggest, fanciest letters you can. Then tell the person next to you what \"loose\" means in three words or fewer."},
 {word:'pickle',badge:'Sherlock of Kindness',silly:"Detective eyebrows! Look at the person next to you and say one kind thing you notice: a good laugh, great effort, a cool vibe."},
 {word:'llama',badge:'Big Ears',silly:"Big Ears! Cup your hands behind your ears. With a partner, one person tells the world's worst joke in 20 seconds. The other listens with their whole face and says nothing."},
 {word:'waffle',badge:'Knot Wizard',silly:"Knot Race! Tie three knots in a cloth strip or a shoelace, swap with a neighbor, and untie theirs. No pulling, only kindness."},
 {word:'hiccup',badge:'Bridge Builder',silly:"The Squeeze! Stand in a circle and pass a hand squeeze, or a shoulder tap, all the way around. Time it, then beat your record."}
];

function fresh(){return {screen:'welcome',mode:'group',crew:'',points:0,stnDone:{},gate:0,silly:{},wordMsg:'',q1:null,sc:null,stn:0,sub:0,picked:null,scored:{},first:0,total:0,know:null,mood:null,small:{},stillLeft:30,stillState:'idle',kind:'',who:'',pledge:''};}
var S=fresh();
var timer=null;
function clearTimer(){if(timer){clearInterval(timer);timer=null;}}

function setProg(n){
  var h='';for(var i=0;i<6;i++){h+='<i'+(i<n?' class="on"':'')+'></i>';}prog.innerHTML=h;
  var p=document.getElementById('pts');
  if(p){if(S.mode==='group'&&S.screen!=='welcome'){p.hidden=false;p.textContent=S.points+' pts';}else{p.hidden=true;}}
}
function progN(){
  if(S.screen==='gate')return S.gate;
  if(S.screen==='stn')return S.stn+1;
  if(S.screen==='finish'||S.screen==='card')return 6;
  return 0;
}
function maxSub(){return S.stn===3?3:2;}

function focusHead(){
  window.scrollTo(0,0);

function resetStillIfRunning(){clearTimer();if(S.stillState==='run')S.stillState='idle';}
function afterGate(g){
  S.picked=null;
  if(g>=4){S.screen='finish';}
  else{S.stn=g;S.sub=0;S.screen='stn';}
}
function finishStation(){
  var k='st'+S.stn;
  if(!S.stnDone[k]){S.stnDone[k]=true;S.points+=10;}
  if(S.mode==='group'){S.gate=S.stn+1;S.picked=null;S.wordMsg='';S.screen='gate';}
  else{afterGate(S.stn+1);}
}
function nextSub(){
  resetStillIfRunning();
  if(S.sub<maxSub()){S.sub++;S.picked=null;}
  else{finishStation();}
  render();focusHead();
}
function prevSub(){
  resetStillIfRunning();
  if(S.sub>0){S.sub--;S.picked=null;}
  else if(S.stn>0){S.stn--;S.sub=(S.stn===3?3:2);S.picked=null;}
  else{S.screen='pick';}
  render();focusHead();
}
function keepVisible(){var f=app.querySelector('.fb');if(f)f.scrollIntoView({block:'nearest'});}

app.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t||t.disabled)return;
  var a=t.getAttribute('data-a'),i=parseInt(t.getAttribute('data-i'),10);
  if(a==='modegroup'){S.mode='group';go('crew');}
  else if(a==='modesolo'){S.mode='solo';go('lazarus');}
  else if(a==='crewpick'){S.crew=CREWS[i];render();}
  else if(a==='crewgo'){go('lazarus');}
  else if(a==='sillydone'){if(!S.silly[i]){S.silly[i]=true;S.points+=5;}render();}
  else if(a==='q1'){S.q1=i;render();keepVisible();}
  else if(a==='topick'){if(S.mode==='group'){S.gate=0;S.wordMsg='';go('gate');}else{go('pick');}}
  else if(a==='backlaz'){go('lazarus');}
  else if(a==='pick'){S.sc=i;S.stn=0;S.sub=0;S.picked=null;go('stn');}
  else if(a==='sub'){nextSub();}
  else if(a==='back'){if(S.screen==='finish'){S.screen='stn';S.stn=3;S.sub=3;render();focusHead();}else{prevSub();}}
  else if(a==='opt'){
    var key=SC[S.sc].id+':'+S.stn;
    S.picked=i;
    if(!S.scored[key]){S.scored[key]=true;S.total++;if(i===SC[S.sc].steps[S.stn].b){S.first++;S.points+=5;}}
    render();keepVisible();
  }
  else if(a==='know'){S.know=i;render();keepVisible();}
  else if(a==='mood'){S.mood=i;render();}
  else if(a==='small'){S.small[i]=!S.small[i];render();}
  else if(a==='still'){
    S.stillState='run';S.stillLeft=30;render();
    timer=setInterval(function(){
      S.stillLeft--;
      var n=document.getElementById('stillN');
      if(S.stillLeft<=0){clearTimer();S.stillState='done';render();}
      else if(n){n.textContent=S.stillLeft;}
    },1000);
  }
  else if(a==='tofinish'){resetStillIfRunning();finishStation();render();focusHead();}
  else if(a==='tocard'){go('card');}
  else if(a==='another'){S.stn=0;S.sub=0;S.picked=null;go('pick');}
  else if(a==='restart'){S=fresh();go('welcome');}
});
app.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='who')S.who=e.target.value;
  else if(id==='kind')S.kind=e.target.value;
  else if(id==='pledge')S.pledge=e.target.value;
});

app.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id!=='wordForm')return;
  var v=(document.getElementById('word').value||'').toLowerCase().replace(/[^a-z]/g,'');
  if(v===GATES[S.gate].word||v==='ianopen'){
    S.wordMsg='';S.tries=0;
    if(S.gate===0){go('pick');}else{afterGate(S.gate);render();focusHead();}
  } else {
    S.tries=(S.tries||0)+1;
    S.wordMsg='Not yet! Wait for Ian to say the Crew Word.'+(S.tries>=3?' Still stuck? Raise your hand and Ian will help.':'');render();
    var w=document.getElementById('word');if(w)w.focus();
  }
});

var hb=document.getElementById('helpBtn'),hp=document.getElementById('helpPanel');
hb.addEventListener('click',function(){
  var open=hp.hidden;hp.hidden=!open;hb.setAttribute('aria-expanded',open?'true':'false');
  hb.textContent=open?'Close':'Need help now?';
});

render();
})();
</script>
</body>
</html>
