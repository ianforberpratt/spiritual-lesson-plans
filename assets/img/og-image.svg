<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ogTitle">
  <title id="ogTitle">Spiritual Lesson Plans — made with love for every faith background, rooted in Christian Science</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#362F4B"/>
      <stop offset="55%" stop-color="#453c5c"/>
      <stop offset="100%" stop-color="#2c2640"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#E8A94C" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#E8A94C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <circle cx="600" cy="110" r="3" fill="#A9C9D9" opacity="0.6"/>
  <circle cx="980" cy="85" r="3" fill="#FBF5EA" opacity="0.4"/>
  <circle cx="220" cy="75" r="3" fill="#FBF5EA" opacity="0.4"/>

  <!-- a simple, sturdy foundation mark: three grounded columns, wide and load-bearing —
       "built strong" made literal without being heavy-handed -->
  <g opacity="0.9">
    <rect x="560" y="132" width="10" height="40" rx="3" fill="#E8A94C"/>
    <rect x="595" y="132" width="10" height="40" rx="3" fill="#A9C9D9"/>
    <rect x="630" y="132" width="10" height="40" rx="3" fill="#8CA37E"/>
    <rect x="548" y="172" width="104" height="6" rx="3" fill="#FBF5EA" opacity="0.55"/>
  </g>

  <!-- Two lines only, blown up to survive a thumbnail: the name, then the promise. -->
  <text x="600" y="360" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', serif" font-size="98" font-weight="700" fill="#FBF5EA">
    Spiritual Lesson Plans
  </text>
  <text x="600" y="455" text-anchor="middle" font-family="Georgia, serif" font-size="35" font-style="italic" fill="#E8A94C">
    Made with Love for every faith background &#8212; rooted in Christian Science
  </text>
</svg>
