<!DOCTYPE html>

<style>
  :root{ --cream:#FBF5EA; --gold:#E8A94C; --ink:#362F4B; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:#EAE2D2;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .toolbar{
    width:100%;
    background:var(--ink);
    color:var(--cream);
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .toolbar a{ color:var(--cream); text-decoration:none; font-size:14px; opacity:.85; }
  .toolbar a:hover{ opacity:1; text-decoration:underline; }
  .toolbar button{
    background:var(--gold);
    color:#3B2A0E;
    border:none;
    border-radius:4px;
    padding:9px 18px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .toolbar button:hover{ filter:brightness(1.05); }
  .sheet-wrap{ padding:28px 16px 44px; width:100%; display:flex; justify-content:center; }
  .sheet{
    background:#fff;
    box-shadow:0 12px 40px rgba(0,0,0,.18);
    width:816px;
    max-width:100%;
  }
  .sheet svg{ display:block; width:100%; height:auto; }
  @media print {
    .toolbar{ display:none; }
    body{ background:#fff; min-height:0; }
    .sheet-wrap{ padding:0; }
    .sheet{ box-shadow:none; width:auto; max-width:none; }
    @page{ size:letter; margin:0; }
  }
</style>

  <text x="60" y="124" font-size="42" fill="#362F4B" font-weight="700">The Bridge Line</text>
  <rect x="60" y="142" width="72" height="4" fill="#B8763F"/>
  <text x="60" y="178" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Say this out loud, mid-disagreement. Practice it here first.</text>

  <text x="90" y="308" font-size="21" fill="#FAF8F5" font-family="Georgia, serif" font-style="italic">I think we both want</text>

  <text x="672" y="308" font-size="21" fill="#FAF8F5" font-family="Georgia, serif" font-style="italic">.&#8221;</text>

  <text x="60" y="404" font-size="14" fill="#8B8496" font-family="Helvetica, Arial, sans-serif">Now practice it on a few real (or made-up) disagreements:</text>

  <text x="110" y="480" font-size="14" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">We might both actually want:</text>
  <line x1="300" y1="484" x2="756" y2="484" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="60" y1="512" x2="756" y2="512" stroke="#E4DED0" stroke-width="1.2"/>

  <!-- Practice 2 -->
  <circle cx="70" cy="568" r="18" fill="#362F4B"/>
  <text x="70" y="574" font-size="15" fill="#FAF8F5" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">2</text>
  <text x="110" y="548" font-size="14" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">Disagreement:</text>
  <line x1="220" y1="552" x2="756" y2="552" stroke="#362F4B" stroke-width="1.1"/>
  <text x="110" y="588" font-size="14" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">We might both actually want:</text>
  <line x1="300" y1="592" x2="756" y2="592" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="60" y1="620" x2="756" y2="620" stroke="#E4DED0" stroke-width="1.2"/>

  <!-- Practice 3 -->
  <circle cx="70" cy="676" r="18" fill="#362F4B"/>
  <text x="70" y="682" font-size="15" fill="#FAF8F5" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">3</text>
  <text x="110" y="656" font-size="14" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">Disagreement:</text>

  <text x="110" y="696" font-size="14" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">We might both actually want:</text>
  <line x1="300" y1="700" x2="756" y2="700" stroke="#362F4B" stroke-width="1.1"/>

  <text x="408" y="770" font-size="15" fill="#B8763F" font-family="Georgia, serif" font-style="italic" text-anchor="middle">This isn&#8217;t about winning. It&#8217;s about finding what&#8217;s already shared.</text>
