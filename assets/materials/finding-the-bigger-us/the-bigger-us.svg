<svg viewBox="0 0 816 1056" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="816" height="1056" fill="#FAF8F5"/>

  <!-- Header -->
  <text x="60" y="70" font-size="12" letter-spacing="2" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="600">A VISUAL &#183; FINDING THE BIGGER &#8220;US&#8221;</text>
  <text x="60" y="124" font-size="42" fill="#362F4B" font-weight="700">The Bigger Us</text>
  <rect x="60" y="142" width="72" height="4" fill="#B8763F"/>
  <text x="60" y="178" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Fill in what you want, what they might want, and where those overlap.</text>

  <!-- Venn circles -->
  <circle cx="310" cy="530" r="190" fill="#362F4B" opacity="0.16" stroke="#362F4B" stroke-width="2.5"/>
  <circle cx="506" cy="530" r="190" fill="#B8763F" opacity="0.20" stroke="#B8763F" stroke-width="2.5"/>

  <!-- ME side -->
  <text x="175" y="410" font-size="24" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">ME</text>
  <text x="175" y="436" font-size="12.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">what I want:</text>
  <line x1="115" y1="470" x2="255" y2="470" stroke="#362F4B" stroke-width="1.2"/>
  <line x1="115" y1="510" x2="255" y2="510" stroke="#362F4B" stroke-width="1.2"/>
  <line x1="115" y1="550" x2="255" y2="550" stroke="#362F4B" stroke-width="1.2"/>

  <!-- THEM side -->
  <text x="641" y="410" font-size="24" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">THEM</text>
  <text x="641" y="436" font-size="12.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">what they might want:</text>
  <line x1="561" y1="470" x2="701" y2="470" stroke="#B8763F" stroke-width="1.2"/>
  <line x1="561" y1="510" x2="701" y2="510" stroke="#B8763F" stroke-width="1.2"/>
  <line x1="561" y1="550" x2="701" y2="550" stroke="#B8763F" stroke-width="1.2"/>

  <!-- overlap: THE BIGGER US -->
  <text x="408" y="500" font-size="18" fill="#5A3E2B" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">THE BIGGER US</text>
  <text x="408" y="520" font-size="11" fill="#5A3E2B" font-family="Helvetica, Arial, sans-serif" font-style="italic" text-anchor="middle">(what we might both actually want)</text>
  <line x1="335" y1="556" x2="481" y2="556" stroke="#5A3E2B" stroke-width="1.4"/>
  <line x1="335" y1="592" x2="481" y2="592" stroke="#5A3E2B" stroke-width="1.4"/>

  <text x="408" y="800" font-size="15" fill="#B8763F" font-family="Georgia, serif" font-style="italic" text-anchor="middle">You might be surprised how much overlap is already there.</text>
  <text x="408" y="826" font-size="12.5" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Finding the bigger us doesn&#8217;t mean pretending the disagreement isn&#8217;t real.</text>

  <!-- footer -->
  <text x="60" y="985" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif">Spiritual Lesson Plans &#183; spirituallessonplans.org</text>
  <text x="756" y="985" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="end">Free to use, adapt, and share &#183; CC BY-SA 4.0</text>
</svg>
