<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Permission Slip — Spiritual Lesson Plans</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23E8A94C%22/></svg>">
<style>
  :root{ --cream:#FBF5EA; --gold:#E8A94C; --ink:#362F4B; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:#EAE2D2;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .toolbar{
    width:100%;
    background:var(--ink);
    color:var(--cream);
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .toolbar a{ color:var(--cream); text-decoration:none; font-size:14px; opacity:.85; }
  .toolbar a:hover{ opacity:1; text-decoration:underline; }
  .toolbar button{
    background:var(--gold);
    color:#3B2A0E;
    border:none;
    border-radius:4px;
    padding:9px 18px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .toolbar button:hover{ filter:brightness(1.05); }
  .sheet-wrap{ padding:28px 16px 44px; width:100%; display:flex; justify-content:center; }
  .sheet{
    background:#fff;
    box-shadow:0 12px 40px rgba(0,0,0,.18);
    width:816px;
    max-width:100%;
  }
  .sheet svg{ display:block; width:100%; height:auto; }
  @media print {
    .toolbar{ display:none; }
    body{ background:#fff; min-height:0; }
    .sheet-wrap{ padding:0; }
    .sheet{ box-shadow:none; width:auto; max-width:none; }
    @page{ size:letter; margin:0; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <a href="/lessons/off-days-are-allowed">&larr; Back to the lesson</a>
  <button type="button" onclick="window.print()">Print this handout</button>
</div>
<div class="sheet-wrap">
  <div class="sheet">
<svg viewBox="0 0 816 1056" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="816" height="1056" fill="#FAF8F5"/>

  <!-- decorative certificate border -->
  <rect x="40" y="40" width="736" height="900" fill="none" stroke="#362F4B" stroke-width="2.5"/>
  <rect x="54" y="54" width="708" height="872" fill="none" stroke="#B8763F" stroke-width="1.2"/>

  <!-- Header -->
  <text x="408" y="102" font-size="12" letter-spacing="2" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">A KEEPSAKE &#183; OFF DAYS ARE ALLOWED</text>
  <text x="408" y="172" font-size="46" fill="#362F4B" font-weight="700" text-anchor="middle">Permission Slip</text>
  <rect x="348" y="192" width="120" height="4" fill="#B8763F" transform="translate(0,0)"/>
  <rect x="348" y="192" width="120" height="4" fill="#B8763F"/>

  <text x="408" y="250" font-size="17" fill="#4A4356" font-family="Georgia, serif" text-anchor="middle">This is to certify that</text>

  <line x1="200" y1="292" x2="616" y2="292" stroke="#362F4B" stroke-width="1.3"/>
  <text x="408" y="314" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" font-style="italic" text-anchor="middle">(that&#8217;s you &#8212; go ahead, write your name)</text>

  <text x="408" y="372" font-size="26" fill="#362F4B" font-family="Georgia, serif" font-weight="700" text-anchor="middle">is permitted to have an OFF DAY.</text>

  <text x="408" y="424" font-size="16" fill="#4A4356" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">No questions asked.</text>
  <text x="408" y="454" font-size="16" fill="#4A4356" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">No penalty.</text>
  <text x="408" y="484" font-size="16" fill="#4A4356" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">No proof required.</text>
  <text x="408" y="522" font-size="16" fill="#362F4B" font-family="Georgia, serif" font-style="italic" text-anchor="middle">Wholeness was never something you had to earn.</text>

  <!-- flourish divider -->
  <line x1="280" y1="566" x2="380" y2="566" stroke="#D8AF87" stroke-width="1.5"/>
  <path d="M400,566 L408,558 L416,566 L408,574 Z" fill="#B8763F"/>
  <line x1="436" y1="566" x2="536" y2="566" stroke="#D8AF87" stroke-width="1.5"/>

  <!-- signature section -->
  <text x="140" y="648" font-size="14" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">Signed,</text>
  <line x1="140" y1="678" x2="380" y2="678" stroke="#362F4B" stroke-width="1.2"/>
  <text x="260" y="698" font-size="11" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" font-style="italic" text-anchor="middle">(you)</text>

  <text x="480" y="648" font-size="14" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">Date</text>
  <line x1="480" y1="678" x2="700" y2="678" stroke="#362F4B" stroke-width="1.2"/>

  <!-- seal -->
  <circle cx="690" cy="790" r="65" fill="#B8763F"/>
  <circle cx="690" cy="790" r="52" fill="none" stroke="#FAF8F5" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M690,760 L696,772 L708,775 L696,778 L690,790 L684,778 L672,775 L684,772 Z" fill="#FAF8F5"/>
  <text x="690" y="808" font-size="13" fill="#FAF8F5" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="1" text-anchor="middle">APPROVED</text>
  <text x="690" y="824" font-size="9" fill="#FAF8F5" font-family="Helvetica, Arial, sans-serif" font-style="italic" opacity="0.85" text-anchor="middle">no proof required</text>

  <!-- footer -->
  <text x="60" y="985" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif">Spiritual Lesson Plans &#183; spirituallessonplans.org</text>
  <text x="756" y="985" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="end">Free to use, adapt, and share &#183; CC BY-SA 4.0</text>
</svg>
  </div>
</div>
</body>
</html>
