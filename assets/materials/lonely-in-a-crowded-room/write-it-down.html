<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write It Down — Spiritual Lesson Plans</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23E8A94C%22/></svg>">
<style>
  :root{ --cream:#FBF5EA; --gold:#E8A94C; --ink:#362F4B; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:#EAE2D2;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .toolbar{
    width:100%;
    background:var(--ink);
    color:var(--cream);
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .toolbar a{ color:var(--cream); text-decoration:none; font-size:14px; opacity:.85; }
  .toolbar a:hover{ opacity:1; text-decoration:underline; }
  .toolbar button{
    background:var(--gold);
    color:#3B2A0E;
    border:none;
    border-radius:4px;
    padding:9px 18px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .toolbar button:hover{ filter:brightness(1.05); }
  .sheet-wrap{ padding:28px 16px 44px; width:100%; display:flex; justify-content:center; }
  .sheet{
    background:#fff;
    box-shadow:0 12px 40px rgba(0,0,0,.18);
    width:816px;
    max-width:100%;
  }
  .sheet svg{ display:block; width:100%; height:auto; }
  @media print {
    .toolbar{ display:none; }
    body{ background:#fff; min-height:0; }
    .sheet-wrap{ padding:0; }
    .sheet{ box-shadow:none; width:auto; max-width:none; }
    @page{ size:letter; margin:0; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <a href="/lessons/lonely-in-a-crowded-room">&larr; Back to the lesson</a>
  <button type="button" onclick="window.print()">Print this handout</button>
</div>
<div class="sheet-wrap">
  <div class="sheet">
<svg viewBox="0 0 816 1056" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="816" height="1056" fill="#FAF8F5"/>

  <!-- Header -->
  <text x="60" y="70" font-size="12" letter-spacing="2" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="600">A HANDOUT &#183; LONELY IN A CROWDED ROOM</text>
  <text x="60" y="124" font-size="42" fill="#362F4B" font-weight="700">Write It Down</text>
  <rect x="60" y="142" width="72" height="4" fill="#B8763F"/>
  <text x="60" y="178" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">A take-home version to carry the ache and the truth in the same pocket.</text>

  <!-- Prompt 1 -->
  <circle cx="70" cy="270" r="18" fill="#362F4B"/>
  <text x="70" y="276" font-size="15" fill="#FAF8F5" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">1</text>
  <text x="110" y="252" font-size="16" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">When do I feel the ache of loneliness most?</text>
  <line x1="110" y1="300" x2="756" y2="300" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="110" y1="336" x2="756" y2="336" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="60" y1="372" x2="756" y2="372" stroke="#E4DED0" stroke-width="1.2"/>

  <!-- Prompt 2 -->
  <circle cx="70" cy="428" r="18" fill="#362F4B"/>
  <text x="70" y="434" font-size="15" fill="#FAF8F5" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">2</text>
  <text x="110" y="410" font-size="16" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">One thing that&#8217;s true about me, no matter what:</text>
  <line x1="110" y1="458" x2="756" y2="458" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="110" y1="494" x2="756" y2="494" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="60" y1="530" x2="756" y2="530" stroke="#E4DED0" stroke-width="1.2"/>

  <!-- Prompt 3 -->
  <circle cx="70" cy="586" r="18" fill="#362F4B"/>
  <text x="70" y="592" font-size="15" fill="#FAF8F5" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">3</text>
  <text x="110" y="568" font-size="16" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">One person I can reach out to this week:</text>
  <line x1="110" y1="616" x2="756" y2="616" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="60" y1="652" x2="756" y2="652" stroke="#E4DED0" stroke-width="1.2"/>

  <!-- Carry this with you -->
  <text x="60" y="712" font-size="12" letter-spacing="2" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="600">CARRY THIS WITH YOU</text>

  <rect x="60" y="732" width="696" height="122" rx="16" fill="#362F4B"/>
  <text x="90" y="770" font-size="16" fill="#FAF8F5" font-family="Georgia, serif" font-style="italic">&#8220;Neither death nor life, neither angels nor demons, neither the</text>
  <text x="90" y="794" font-size="16" fill="#FAF8F5" font-family="Georgia, serif" font-style="italic">present nor the future&#8230; will be able to separate us from the</text>
  <text x="90" y="818" font-size="16" fill="#FAF8F5" font-family="Georgia, serif" font-style="italic">love of God.&#8221; &#8212; Romans 8:38&#8211;39</text>
  <text x="90" y="842" font-size="13" fill="#D8AF87" font-family="Helvetica, Arial, sans-serif">&#8220;Divine Love always has met and always will meet every human need.&#8221; &#8212; Mary Baker Eddy, Science and Health, p. 494</text>

  <!-- footer -->
  <line x1="60" y1="920" x2="756" y2="920" stroke="#E4DED0" stroke-width="1.5"/>
  <text x="60" y="950" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif">Spiritual Lesson Plans &#183; spirituallessonplans.org</text>
  <text x="756" y="950" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="end">Free to use, adapt, and share &#183; CC BY-SA 4.0</text>
</svg>
  </div>
</div>
</body>
</html>
