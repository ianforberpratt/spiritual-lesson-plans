<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Steps for a Lonely Moment — Spiritual Lesson Plans</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23E8A94C%22/></svg>">
<style>
  :root{ --cream:#FBF5EA; --gold:#E8A94C; --ink:#362F4B; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:#EAE2D2;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .toolbar{
    width:100%;
    background:var(--ink);
    color:var(--cream);
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .toolbar a{ color:var(--cream); text-decoration:none; font-size:14px; opacity:.85; }
  .toolbar a:hover{ opacity:1; text-decoration:underline; }
  .toolbar button{
    background:var(--gold);
    color:#3B2A0E;
    border:none;
    border-radius:4px;
    padding:9px 18px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .toolbar button:hover{ filter:brightness(1.05); }
  .sheet-wrap{ padding:28px 16px 44px; width:100%; display:flex; justify-content:center; }
  .sheet{
    background:#fff;
    box-shadow:0 12px 40px rgba(0,0,0,.18);
    width:816px;
    max-width:100%;
  }
  .sheet svg{ display:block; width:100%; height:auto; }
  @media print {
    .toolbar{ display:none; }
    body{ background:#fff; min-height:0; }
    .sheet-wrap{ padding:0; }
    .sheet{ box-shadow:none; width:auto; max-width:none; }
    @page{ size:letter; margin:0; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <a href="/lessons/lonely-in-a-crowded-room">&larr; Back to the lesson</a>
  <button type="button" onclick="window.print()">Print this handout</button>
</div>
<div class="sheet-wrap">
  <div class="sheet">
<svg viewBox="0 0 816 1056" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="816" height="1056" fill="#FAF8F5"/>

  <!-- Header -->
  <text x="60" y="70" font-size="12" letter-spacing="2" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="600">A POCKET CARD &#183; LONELY IN A CROWDED ROOM</text>
  <text x="60" y="124" font-size="42" fill="#362F4B" font-weight="700">Three Steps for a Lonely Moment</text>
  <rect x="60" y="142" width="72" height="4" fill="#B8763F"/>
  <text x="60" y="178" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Pull this out the next time the ache shows up &#8212; in a crowd or alone.</text>

  <!-- quote box -->
  <rect x="60" y="216" width="696" height="128" rx="16" fill="#362F4B"/>
  <text x="90" y="264" font-size="19" fill="#FAF8F5" font-family="Georgia, serif" font-style="italic">&#8220;You belong because you are of God, made in His likeness,</text>
  <text x="90" y="294" font-size="19" fill="#FAF8F5" font-family="Georgia, serif" font-style="italic">held in His love. That&#8217;s the foundation you&#8217;re standing on</text>
  <text x="90" y="324" font-size="19" fill="#FAF8F5" font-family="Georgia, serif" font-style="italic">right now.&#8221;</text>

  <!-- Step 1: Determine -->
  <circle cx="70" cy="410" r="18" fill="#362F4B"/>
  <text x="70" y="416" font-size="15" fill="#FAF8F5" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">1</text>
  <text x="110" y="404" font-size="19" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700">Determine</text>
  <text x="110" y="430" font-size="14" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Pause. Notice the feeling without judging it.</text>
  <text x="110" y="452" font-size="13" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" font-style="italic">Ask: does this feeling match the truth of who I am?</text>
  <line x1="60" y1="484" x2="756" y2="484" stroke="#E4DED0" stroke-width="1.2"/>

  <!-- Step 2: Reframe -->
  <circle cx="70" cy="540" r="18" fill="#362F4B"/>
  <text x="70" y="546" font-size="15" fill="#FAF8F5" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">2</text>
  <text x="110" y="534" font-size="19" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700">Reframe</text>
  <text x="110" y="560" font-size="14" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Shift from the feeling to the fact.</text>
  <text x="110" y="582" font-size="13" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" font-style="italic">Say to yourself: loneliness is a claim of absence.</text>
  <text x="110" y="600" font-size="13" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" font-style="italic">God&#8217;s presence is infinite. I am known, seen, and cherished right now.</text>
  <line x1="60" y1="632" x2="756" y2="632" stroke="#E4DED0" stroke-width="1.2"/>

  <!-- Step 3: Act -->
  <circle cx="70" cy="688" r="18" fill="#362F4B"/>
  <text x="70" y="694" font-size="15" fill="#FAF8F5" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">3</text>
  <text x="110" y="682" font-size="19" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700">Act</text>
  <text x="110" y="708" font-size="14" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Reach toward God before reaching for your phone.</text>
  <text x="110" y="728" font-size="14" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Then look outward &#8212; one small way to show up for someone else.</text>
  <text x="110" y="750" font-size="13" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" font-style="italic">Ask: who might need to hear from me today?</text>

  <text x="408" y="830" font-size="15" fill="#B8763F" font-family="Georgia, serif" font-style="italic" text-anchor="middle">Loneliness is a claim of absence. Love&#8217;s presence is infinite.</text>

  <!-- footer -->
  <line x1="60" y1="960" x2="756" y2="960" stroke="#E4DED0" stroke-width="1.5"/>
  <text x="60" y="990" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif">Spiritual Lesson Plans &#183; spirituallessonplans.org</text>
  <text x="756" y="990" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="end">Free to use, adapt, and share &#183; CC BY-SA 4.0</text>
</svg>
  </div>
</div>
</body>
</html>
