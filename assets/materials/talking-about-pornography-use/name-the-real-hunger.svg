<svg viewBox="0 0 816 1056" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="816" height="1056" fill="#FAF8F5"/>

  <!-- Header -->
  <text x="60" y="66" font-size="11" letter-spacing="1.5" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="600">A HANDOUT &#183; TALKING ABOUT THE INCREASE OF PORNOGRAPHY USE IN OUR WORLD</text>
  <text x="60" y="122" font-size="38" fill="#362F4B" font-weight="700">Name the Real Hunger</text>
  <rect x="60" y="140" width="72" height="4" fill="#B8763F"/>
  <text x="60" y="176" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Private. Nobody has to see this. Don&#8217;t describe anything you&#8217;ve seen &#8212;</text>
  <text x="60" y="198" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">just notice the pattern underneath it.</text>

  <!-- What it promises -->
  <text x="60" y="248" font-size="14" letter-spacing="1" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700">WHAT IT PROMISES</text>

  <circle cx="75" cy="282" r="9" fill="none" stroke="#8B8496" stroke-width="1.5"/>
  <text x="92" y="287" font-size="14.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Comfort</text>
  <circle cx="420" cy="282" r="9" fill="none" stroke="#8B8496" stroke-width="1.5"/>
  <text x="437" y="287" font-size="14.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Connection</text>

  <circle cx="75" cy="320" r="9" fill="none" stroke="#8B8496" stroke-width="1.5"/>
  <text x="92" y="325" font-size="14.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Feeling wanted</text>
  <circle cx="420" cy="320" r="9" fill="none" stroke="#8B8496" stroke-width="1.5"/>
  <text x="437" y="325" font-size="14.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Feeling in control</text>

  <circle cx="75" cy="358" r="9" fill="none" stroke="#8B8496" stroke-width="1.5"/>
  <text x="92" y="363" font-size="14.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Escape or relief</text>
  <circle cx="420" cy="358" r="9" fill="none" stroke="#8B8496" stroke-width="1.5"/>
  <text x="437" y="363" font-size="14.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Boredom</text>

  <circle cx="75" cy="396" r="9" fill="none" stroke="#8B8496" stroke-width="1.5"/>
  <text x="92" y="401" font-size="14.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Loneliness</text>
  <circle cx="420" cy="396" r="9" fill="none" stroke="#8B8496" stroke-width="1.5"/>
  <text x="437" y="401" font-size="14.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Something else</text>

  <line x1="60" y1="432" x2="756" y2="432" stroke="#E4DED0" stroke-width="1.4"/>

  <!-- What it left -->
  <text x="60" y="470" font-size="15" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">What it actually left me feeling afterward:</text>
  <line x1="60" y1="504" x2="756" y2="504" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="60" y1="540" x2="756" y2="540" stroke="#362F4B" stroke-width="1.1"/>

  <!-- Real hunger box -->
  <rect x="60" y="590" width="696" height="180" rx="14" fill="#F3ECDF" stroke="#D8AF87" stroke-width="1.5"/>
  <text x="90" y="624" font-size="14" letter-spacing="1" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700">THE REAL HUNGER UNDERNEATH, IF I&#8217;M HONEST</text>
  <line x1="90" y1="666" x2="726" y2="666" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="90" y1="706" x2="726" y2="706" stroke="#362F4B" stroke-width="1.1"/>
  <text x="90" y="748" font-size="13.5" fill="#8B8496" font-family="Georgia, serif" font-style="italic">It&#8217;s rarely actually about what&#8217;s on the screen.</text>

  <!-- footer -->
  <line x1="60" y1="960" x2="756" y2="960" stroke="#E4DED0" stroke-width="1.5"/>
  <text x="60" y="990" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif">Spiritual Lesson Plans &#183; spirituallessonplans.org</text>
  <text x="756" y="990" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="end">Free to use, adapt, and share &#183; CC BY-SA 4.0</text>
</svg>
