<style>
  :root{ --cream:#FBF5EA; --gold:#E8A94C; --ink:#362F4B; }
  *{ box-sizing:border-box; }

  .toolbar button{
    background:var(--gold);
    color:#3B2A0E;
    border:none;
    border-radius:4px;
    padding:9px 18px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .toolbar button:hover{ filter:brightness(1.05); }
  .sheet-wrap{ padding:28px 16px 44px; width:100%; display:flex; justify-content:center; }
  .sheet{
    background:#fff;
    box-shadow:0 12px 40px rgba(0,0,0,.18);
    width:816px;
    max-width:100%;
  }
  .sheet svg{ display:block; width:100%; height:auto; }
  @media print {
    .toolbar{ display:none; }
    body{ background:#fff; min-height:0; }
    .sheet-wrap{ padding:0; }
    .sheet{ box-shadow:none; width:auto; max-width:none; }

  <text x="60" y="160" font-size="14.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">The habit is the cloud. It was never the sun. Practice saying it that way.</text>

  <text x="80" y="356" font-size="11" letter-spacing="1.5" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="700">EXAMPLE</text>
  <text x="80" y="384" font-size="14.5" fill="#362F4B" font-family="Georgia, serif">&#8220;I&#8217;m disgusting for looking at that&#8221; becomes &#8230;</text>
  <text x="80" y="412" font-size="14.5" fill="#362F4B" font-family="Georgia, serif" font-style="italic">&#8220;That&#8217;s inconsistent with who I actually am. It&#8217;s a thief of my peace,</text>
  <text x="80" y="438" font-size="14.5" fill="#362F4B" font-family="Georgia, serif" font-style="italic">not proof of who I am. I&#8217;m whole, and I get to just adjust and keep moving.&#8221;</text>
  <text x="80" y="464" font-size="12.5" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" font-style="italic">Not proof of who I am &#8212; just a cloud, passing.</text>

  <text x="60" y="512" font-size="13.5" fill="#8B8496" font-family="Helvetica, Arial, sans-serif">Now try your own, a few times &#8212; use this pattern whenever the cloud shows up.</text>
