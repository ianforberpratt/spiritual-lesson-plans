<svg viewBox="0 0 816 1056" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="816" height="1056" fill="#FAF8F5"/>

  <!-- Header -->
  <text x="60" y="70" font-size="12" letter-spacing="2" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="600">A HANDOUT &#183; WORDS THAT OPEN DOORS</text>
  <text x="60" y="124" font-size="42" fill="#362F4B" font-weight="700">Translate It</text>
  <rect x="60" y="142" width="72" height="4" fill="#B8763F"/>
  <text x="60" y="178" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Pick one old word. Translate it into words that feel true to you today &#8212;</text>
  <text x="60" y="200" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">without losing what the original was trying to protect.</text>

  <!-- example -->
  <rect x="60" y="230" width="696" height="100" rx="14" fill="#F3ECDF" stroke="#D8AF87" stroke-width="1.5"/>
  <text x="80" y="254" font-size="11" letter-spacing="1.5" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="700">EXAMPLE</text>
  <text x="80" y="286" font-size="17" fill="#362F4B" font-family="Georgia, serif"><tspan font-weight="700">&#8220;Master&#8221;</tspan> becomes &#8230;</text>
  <text x="80" y="314" font-size="17" fill="#362F4B" font-family="Georgia, serif" font-style="italic">&#8220;Someone who shows me a door, not someone who stands in it.&#8221;</text>

  <!-- Row 1 -->
  <text x="60" y="400" font-size="14" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">Old word:</text>
  <line x1="150" y1="404" x2="330" y2="404" stroke="#362F4B" stroke-width="1.1"/>
  <text x="350" y="400" font-size="14" fill="#B8763F" font-family="Georgia, serif" font-style="italic">becomes</text>
  <line x1="420" y1="404" x2="756" y2="404" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="60" y1="430" x2="756" y2="430" stroke="#E4DED0" stroke-width="1.2"/>

  <!-- Row 2 -->
  <text x="60" y="474" font-size="14" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">Old word:</text>
  <line x1="150" y1="478" x2="330" y2="478" stroke="#362F4B" stroke-width="1.1"/>
  <text x="350" y="474" font-size="14" fill="#B8763F" font-family="Georgia, serif" font-style="italic">becomes</text>
  <line x1="420" y1="478" x2="756" y2="478" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="60" y1="504" x2="756" y2="504" stroke="#E4DED0" stroke-width="1.2"/>

  <!-- Row 3 -->
  <text x="60" y="548" font-size="14" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">Old word:</text>
  <line x1="150" y1="552" x2="330" y2="552" stroke="#362F4B" stroke-width="1.1"/>
  <text x="350" y="548" font-size="14" fill="#B8763F" font-family="Georgia, serif" font-style="italic">becomes</text>
  <line x1="420" y1="552" x2="756" y2="552" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="60" y1="578" x2="756" y2="578" stroke="#E4DED0" stroke-width="1.2"/>

  <!-- Row 4 -->
  <text x="60" y="622" font-size="14" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">Old word:</text>
  <line x1="150" y1="626" x2="330" y2="626" stroke="#362F4B" stroke-width="1.1"/>
  <text x="350" y="622" font-size="14" fill="#B8763F" font-family="Georgia, serif" font-style="italic">becomes</text>
  <line x1="420" y1="626" x2="756" y2="626" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="60" y1="652" x2="756" y2="652" stroke="#E4DED0" stroke-width="1.2"/>

  <!-- Row 5 -->
  <text x="60" y="696" font-size="14" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">Old word:</text>
  <line x1="150" y1="700" x2="330" y2="700" stroke="#362F4B" stroke-width="1.1"/>
  <text x="350" y="696" font-size="14" fill="#B8763F" font-family="Georgia, serif" font-style="italic">becomes</text>
  <line x1="420" y1="700" x2="756" y2="700" stroke="#362F4B" stroke-width="1.1"/>

  <text x="408" y="770" font-size="14" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">You&#8217;re not deleting where the word came from. You&#8217;re carrying it forward, honestly.</text>

  <!-- footer -->
  <line x1="60" y1="960" x2="756" y2="960" stroke="#E4DED0" stroke-width="1.5"/>
  <text x="60" y="990" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif">Spiritual Lesson Plans &#183; spirituallessonplans.org</text>
  <text x="756" y="990" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="end">Free to use, adapt, and share &#183; CC BY-SA 4.0</text>
</svg>
