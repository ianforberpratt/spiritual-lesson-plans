  <text x="484" y="694" font-size="17" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">Salvation</text>
  <rect x="576" y="632" width="160" height="110" rx="10" fill="#FFFFFF" stroke="#362F4B" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="656" y="686" font-size="16" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">Congre-</text>
  <text x="656" y="706" font-size="16" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">gation</text>

  <text x="408" y="800" font-size="14" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">Add your own blank cards for words from your own family, culture, or tradition.</text>

