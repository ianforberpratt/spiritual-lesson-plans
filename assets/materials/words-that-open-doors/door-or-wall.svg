  <rect x="576" y="260" width="160" height="110" rx="10" fill="#FFFFFF" stroke="#362F4B" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="656" y="322" font-size="21" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">Holy</text>

