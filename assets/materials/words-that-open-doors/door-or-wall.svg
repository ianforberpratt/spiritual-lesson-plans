<svg viewBox="0 0 816 1056" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="816" height="1056" fill="#FAF8F5"/>

  <!-- Header -->
  <text x="60" y="70" font-size="12" letter-spacing="2" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="600">A HANDOUT &#183; WORDS THAT OPEN DOORS</text>
  <text x="60" y="124" font-size="42" fill="#362F4B" font-weight="700">Door or Wall?</text>
  <rect x="60" y="142" width="72" height="4" fill="#B8763F"/>
  <text x="60" y="178" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Cut these apart. Sort them into two piles: words that feel like a door,</text>
  <text x="60" y="200" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">and words that feel like a wall. No wrong answers &#8212; this is noticing, not confessing.</text>

