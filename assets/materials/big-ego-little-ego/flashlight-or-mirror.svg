<svg viewBox="0 0 816 1056" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="816" height="1056" fill="#FAF8F5"/>

  <!-- Header -->
  <text x="60" y="70" font-size="12" letter-spacing="2" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="600">A VISUAL &#183; BIG EGO, LITTLE EGO</text>
  <text x="60" y="124" font-size="42" fill="#362F4B" font-weight="700">Flashlight or Mirror?</text>
  <rect x="60" y="142" width="72" height="4" fill="#B8763F"/>
  <text x="60" y="178" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Two objects. One truth: you were never supposed to make your own light.</text>

  <!-- Panel: Flashlight -->
  <rect x="60" y="220" width="320" height="360" rx="16" fill="#FFFFFF" stroke="#E4DED0" stroke-width="1.5"/>

  <!-- flashlight icon -->
  <g transform="translate(150,290)">
    <rect x="0" y="20" width="90" height="34" rx="6" fill="#362F4B"/>
    <path d="M90,20 L130,6 L130,74 L90,54 Z" fill="#362F4B"/>
    <line x1="150" y1="12" x2="185" y2="-14" stroke="#D8AF87" stroke-width="4" stroke-linecap="round"/>
    <line x1="155" y1="37" x2="195" y2="37" stroke="#D8AF87" stroke-width="4" stroke-linecap="round"/>
    <line x1="150" y1="62" x2="185" y2="88" stroke="#D8AF87" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="220" y="440" font-size="19" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">FLASHLIGHT</text>

  <circle cx="90" cy="484" r="4" fill="#B8763F"/>
  <text x="106" y="490" font-size="14.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Has to make its own light</text>

  <circle cx="90" cy="518" r="4" fill="#B8763F"/>
  <text x="106" y="524" font-size="14.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Works hard just to keep shining</text>

  <circle cx="90" cy="552" r="4" fill="#B8763F"/>
  <text x="106" y="558" font-size="14.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Runs out. Needs new batteries.</text>

  <!-- Panel: Mirror -->
  <rect x="436" y="220" width="320" height="360" rx="16" fill="#FFFFFF" stroke="#E4DED0" stroke-width="1.5"/>

  <!-- mirror icon -->
  <g transform="translate(596,340)">
    <ellipse cx="0" cy="0" rx="58" ry="72" fill="#F3EEDF" stroke="#362F4B" stroke-width="4"/>
    <line x1="-24" y1="-38" x2="10" y2="38" stroke="#D8AF87" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-46" x2="28" y2="30" stroke="#D8AF87" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <text x="596" y="440" font-size="19" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">MIRROR</text>

  <circle cx="466" cy="484" r="4" fill="#B8763F"/>
  <text x="482" y="490" font-size="14.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Reflects light that&#8217;s already there</text>

  <circle cx="466" cy="518" r="4" fill="#B8763F"/>
  <text x="482" y="524" font-size="14.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Never runs out &#8212; never was making it</text>

  <circle cx="466" cy="552" r="4" fill="#B8763F"/>
  <text x="482" y="558" font-size="14.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Doesn&#8217;t dim when another mirror shines too</text>

  <!-- divider -->
  <line x1="60" y1="620" x2="756" y2="620" stroke="#E4DED0" stroke-width="1.5"/>

  <!-- Quote -->
  <text x="408" y="662" font-size="16" fill="#4A4356" font-style="italic" text-anchor="middle">&#8220;And God said unto Moses, I AM THAT I AM.&#8221; &#8212; Exodus 3:14</text>
  <text x="408" y="690" font-size="16" fill="#4A4356" font-style="italic" text-anchor="middle">&#8220;All the objects of God&#8217;s creation reflect one Mind.&#8221;</text>
  <text x="408" y="712" font-size="13" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">&#8212; Science and Health with Key to the Scriptures, Mary Baker Eddy, p. 588:9</text>

  <!-- pull line -->
  <rect x="60" y="748" width="696" height="76" rx="16" fill="#362F4B"/>
  <text x="408" y="796" font-size="19" fill="#FAF8F5" font-weight="700" text-anchor="middle">&#8220;I don&#8217;t have to make my own light. I already reflect it.&#8221;</text>

  <!-- draw/write prompt -->
  <text x="60" y="866" font-size="15" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">Draw or write one thing that reminds you: you&#8217;re the mirror, not the flashlight.</text>
  <rect x="60" y="884" width="696" height="120" rx="12" fill="#FFFFFF" stroke="#362F4B" stroke-width="1.2" stroke-dasharray="5,6"/>

  <!-- footer -->
  <line x1="60" y1="1030" x2="756" y2="1030" stroke="#E4DED0" stroke-width="1.5"/>
  <text x="60" y="1030" dy="20" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif">Spiritual Lesson Plans &#183; spirituallessonplans.org</text>
  <text x="756" y="1030" dy="20" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="end">Free to use, adapt, and share &#183; CC BY-SA 4.0</text>
</svg>
