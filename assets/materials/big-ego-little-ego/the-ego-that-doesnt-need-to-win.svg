<svg viewBox="0 0 816 1056" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="816" height="1056" fill="#FAF8F5"/>

  <!-- Header -->
  <text x="60" y="70" font-size="12" letter-spacing="2" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="600">A HANDOUT &#183; BIG EGO, LITTLE EGO</text>
  <text x="60" y="122" font-size="38" fill="#362F4B" font-weight="700">The Ego That Doesn&#8217;t Need to Win</text>
  <rect x="60" y="140" width="72" height="4" fill="#B8763F"/>
  <text x="60" y="176" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Keep these somewhere you&#8217;ll actually see them again &#8212; a wallet, a notes app, a drawer at work.</text>

  <text x="60" y="212" font-size="14.5" fill="#4A4356" font-style="italic">&#8220;I, or EGO... there is but one I, or Us, but one divine Principle, or Mind, governing all existence.&#8221;</text>
  <text x="60" y="234" font-size="12.5" fill="#8B8496" font-family="Helvetica, Arial, sans-serif">&#8212; Science and Health with Key to the Scriptures, Mary Baker Eddy, p. 588:9</text>

  <!-- connecting path -->
  <line x1="100" y1="290" x2="100" y2="830" stroke="#D8AF87" stroke-width="3" stroke-dasharray="2,8" stroke-linecap="round"/>

  <!-- Question 1 -->
  <rect x="140" y="270" width="620" height="160" rx="14" fill="#FFFFFF" stroke="#E4DED0" stroke-width="1.5"/>
  <circle cx="100" cy="320" r="30" fill="#362F4B"/>
  <text x="100" y="328" font-size="22" fill="#FAF8F5" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">1</text>
  <text x="170" y="312" font-size="17" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700">Am I trying to win this, or trying to understand it?</text>
  <line x1="170" y1="366" x2="726" y2="366" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="170" y1="402" x2="726" y2="402" stroke="#362F4B" stroke-width="1.1"/>

  <!-- Question 2 -->
  <rect x="140" y="450" width="620" height="160" rx="14" fill="#FFFFFF" stroke="#E4DED0" stroke-width="1.5"/>
  <circle cx="100" cy="500" r="30" fill="#362F4B"/>
  <text x="100" y="508" font-size="22" fill="#FAF8F5" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">2</text>
  <text x="170" y="492" font-size="17" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700">Would I still feel secure here if I got no credit</text>
  <text x="170" y="514" font-size="17" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700">and no one ever knew?</text>
  <line x1="170" y1="546" x2="726" y2="546" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="170" y1="582" x2="726" y2="582" stroke="#362F4B" stroke-width="1.1"/>

  <!-- Question 3 -->
  <rect x="140" y="630" width="620" height="160" rx="14" fill="#FFFFFF" stroke="#E4DED0" stroke-width="1.5"/>
  <circle cx="100" cy="680" r="30" fill="#B8763F"/>
  <text x="100" y="688" font-size="22" fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">3</text>
  <text x="170" y="672" font-size="17" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700">Does their success, or their difference, actually</text>
  <text x="170" y="694" font-size="17" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700">cost me anything real?</text>
  <line x1="170" y1="726" x2="726" y2="726" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="170" y1="762" x2="726" y2="762" stroke="#362F4B" stroke-width="1.1"/>

  <!-- pull line -->
  <rect x="60" y="836" width="696" height="90" rx="16" fill="#362F4B"/>
  <text x="408" y="874" font-size="17" fill="#FAF8F5" font-weight="700" text-anchor="middle">&#8220;You were never actually required to keep proving you&#8217;re real.</text>
  <text x="408" y="900" font-size="17" fill="#FAF8F5" font-weight="700" text-anchor="middle">That job was never yours to begin with.&#8221;</text>

  <!-- footer -->
  <line x1="60" y1="960" x2="756" y2="960" stroke="#E4DED0" stroke-width="1.5"/>
  <text x="60" y="990" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif">Spiritual Lesson Plans &#183; spirituallessonplans.org</text>
  <text x="756" y="990" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="end">Free to use, adapt, and share &#183; CC BY-SA 4.0</text>
</svg>
