<svg viewBox="0 0 816 1056" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="816" height="1056" fill="#FAF8F5"/>

  <!-- Header -->
  <text x="60" y="70" font-size="12" letter-spacing="2" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="600">A VISUAL &#183; LEARNING TO HEAR THE NUDGE</text>
  <text x="60" y="124" font-size="42" fill="#362F4B" font-weight="700">Static, or Signal?</text>
  <rect x="60" y="142" width="72" height="4" fill="#B8763F"/>
  <text x="60" y="178" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Think of a recent decision made under pressure. Mark an X on the tuner &#8212;</text>
  <text x="60" y="200" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">where would the needle actually land?</text>

  <!-- end labels -->
  <text x="90" y="266" font-size="16" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">STATIC</text>
  <text x="726" y="266" font-size="16" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">CLEAR SIGNAL</text>

  <!-- tuner track -->
  <rect x="90" y="300" width="636" height="80" rx="40" fill="#FFFFFF" stroke="#362F4B" stroke-width="2.5"/>
  <!-- ticks -->
  <line x1="150" y1="315" x2="150" y2="330" stroke="#D8D2E0" stroke-width="2"/>
  <line x1="210" y1="315" x2="210" y2="330" stroke="#D8D2E0" stroke-width="2"/>
  <line x1="270" y1="308" x2="270" y2="335" stroke="#B8763F" stroke-width="2.5"/>
  <line x1="330" y1="315" x2="330" y2="330" stroke="#D8D2E0" stroke-width="2"/>
  <line x1="408" y1="308" x2="408" y2="335" stroke="#B8763F" stroke-width="2.5"/>
  <line x1="486" y1="315" x2="486" y2="330" stroke="#D8D2E0" stroke-width="2"/>
  <line x1="546" y1="308" x2="546" y2="335" stroke="#B8763F" stroke-width="2.5"/>
  <line x1="606" y1="315" x2="606" y2="330" stroke="#D8D2E0" stroke-width="2"/>
  <line x1="666" y1="315" x2="666" y2="330" stroke="#D8D2E0" stroke-width="2"/>
  <text x="408" y="365" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">mark your X anywhere along here</text>

  <!-- static knob (left) -->
  <circle cx="90" cy="340" r="46" fill="#362F4B"/>
  <path d="M70,330 L82,340 L74,342 L98,352" fill="none" stroke="#FAF8F5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M72,352 L86,336 L80,335 L104,326" fill="none" stroke="#FAF8F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- signal knob (right) -->
  <circle cx="726" cy="340" r="46" fill="#B8763F"/>
  <path d="M708,352 A26,26 0 0 1 744,352" fill="none" stroke="#FAF8F5" stroke-width="3" stroke-linecap="round"/>
  <path d="M714,342 A16,16 0 0 1 738,342" fill="none" stroke="#FAF8F5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="726" cy="348" r="4" fill="#FAF8F5"/>

  <!-- trait columns -->
  <text x="90" y="430" font-size="14" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Feels like:</text>
  <text x="90" y="462" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Rushed</text>
  <text x="90" y="492" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Forceful</text>
  <text x="90" y="522" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Urgent</text>
  <text x="90" y="552" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Needs control right now</text>

  <text x="726" y="430" font-size="14" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Feels like:</text>
  <text x="726" y="462" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Calm</text>
  <text x="726" y="492" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Quiet</text>
  <text x="726" y="522" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Certain</text>
  <text x="726" y="552" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Invites stillness</text>

  <!-- divider -->
  <line x1="60" y1="610" x2="756" y2="610" stroke="#E4DED0" stroke-width="1.5"/>

  <!-- reflection -->
  <text x="60" y="660" font-size="15" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">The decision I&#8217;m thinking about:</text>
  <line x1="60" y1="694" x2="756" y2="694" stroke="#362F4B" stroke-width="1.2"/>

  <text x="60" y="744" font-size="15" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">What was actually steering &#8212; the quiet voice, or the loud one?</text>
  <line x1="60" y1="778" x2="756" y2="778" stroke="#362F4B" stroke-width="1.2"/>
  <line x1="60" y1="815" x2="756" y2="815" stroke="#362F4B" stroke-width="1.2"/>

  <!-- footer -->
  <line x1="60" y1="960" x2="756" y2="960" stroke="#E4DED0" stroke-width="1.5"/>
  <text x="60" y="990" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif">Spiritual Lesson Plans &#183; spirituallessonplans.org</text>
  <text x="756" y="990" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="end">Free to use, adapt, and share &#183; CC BY-SA 4.0</text>
</svg>
