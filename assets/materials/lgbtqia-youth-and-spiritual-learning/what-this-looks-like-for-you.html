<style>
  :root{ --cream:#FBF5EA; --gold:#E8A94C; --ink:#362F4B; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:#EAE2D2;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .toolbar{
    width:100%;
    background:var(--ink);
    color:var(--cream);
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .toolbar a{ color:var(--cream); text-decoration:none; font-size:14px; opacity:.85; }
  .toolbar a:hover{ opacity:1; text-decoration:underline; }
  .toolbar button{
    background:var(--gold);
    color:#3B2A0E;
    border:none;
    border-radius:4px;
    padding:9px 18px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .toolbar button:hover{ filter:brightness(1.05); }
  .sheet-wrap{ padding:28px 16px 44px; width:100%; display:flex; justify-content:center; }
  .sheet{
    background:#fff;
    box-shadow:0 12px 40px rgba(0,0,0,.18);
    width:816px;
    max-width:100%;
  }
  .sheet svg{ display:block; width:100%; height:auto; }
  @media print {
    .toolbar{ display:none; }
    body{ background:#fff; min-height:0; }
    .sheet-wrap{ padding:0; }
    .sheet{ box-shadow:none; width:auto; max-width:none; }
    @page{ size:letter; margin:0; }

  <text x="60" y="124" font-size="36" fill="#362F4B" font-weight="700">What This Looks Like for You</text>
  <rect x="60" y="142" width="72" height="4" fill="#B8763F"/>
  <text x="60" y="178" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Do whichever track fits. You&#8217;re allowed to do both.</text>

  <text x="82" y="320" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">One truth about who I am,</text>

  <text x="591" y="266" font-size="14" fill="#FAF8F5" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">YOU KNOW</text>

  <text x="448" y="342" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">for them that doesn&#8217;t require</text>

  <line x1="260" y1="800" x2="284" y2="778" stroke="#B8763F" stroke-width="2.5" stroke-linecap="round"/>

  <text x="260" y="852" font-size="11.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">curiosity &amp; care</text>

  <text x="340" y="786" font-size="14" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">If your own beliefs and your care for someone ever feel like</text>
