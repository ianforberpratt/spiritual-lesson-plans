<svg viewBox="0 0 816 1056" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="816" height="1056" fill="#FAF8F5"/>

  <!-- Header -->
  <text x="60" y="70" font-size="12" letter-spacing="2" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="600">A HANDOUT &#183; LGBTQIA+ YOUTH AND SPIRITUAL LEARNING</text>
  <text x="60" y="124" font-size="36" fill="#362F4B" font-weight="700">What This Looks Like for You</text>
  <rect x="60" y="142" width="72" height="4" fill="#B8763F"/>
  <text x="60" y="178" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">Do whichever track fits. You&#8217;re allowed to do both.</text>

  <!-- Panel A -->
  <rect x="60" y="220" width="330" height="440" rx="14" fill="#FFFFFF" stroke="#E4DED0" stroke-width="1.5"/>
  <rect x="60" y="220" width="330" height="64" rx="14" fill="#362F4B"/>
  <rect x="60" y="256" width="330" height="28" fill="#362F4B"/>
  <text x="225" y="260" font-size="15" fill="#FAF8F5" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">IF THIS IS ABOUT YOU</text>

  <text x="82" y="320" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">One truth about who I am,</text>
  <text x="82" y="342" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">spiritually, that doesn&#8217;t depend</text>
  <text x="82" y="364" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">on anyone else&#8217;s opinion:</text>

  <line x1="82" y1="404" x2="368" y2="404" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="82" y1="448" x2="368" y2="448" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="82" y1="492" x2="368" y2="492" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="82" y1="536" x2="368" y2="536" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="82" y1="580" x2="368" y2="580" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="82" y1="624" x2="368" y2="624" stroke="#362F4B" stroke-width="1.1"/>

  <!-- Panel B -->
  <rect x="426" y="220" width="330" height="440" rx="14" fill="#FFFFFF" stroke="#E4DED0" stroke-width="1.5"/>
  <rect x="426" y="220" width="330" height="64" rx="14" fill="#B8763F"/>
  <rect x="426" y="256" width="330" height="28" fill="#B8763F"/>
  <text x="591" y="248" font-size="14" fill="#FAF8F5" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">IF THIS IS ABOUT SOMEONE</text>
  <text x="591" y="266" font-size="14" fill="#FAF8F5" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">YOU KNOW</text>

  <text x="448" y="320" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">One way I could show up</text>
  <text x="448" y="342" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">for them that doesn&#8217;t require</text>
  <text x="448" y="364" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="600">me to have all the answers:</text>

  <line x1="448" y1="404" x2="734" y2="404" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="448" y1="448" x2="734" y2="448" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="448" y1="492" x2="734" y2="492" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="448" y1="536" x2="734" y2="536" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="448" y1="580" x2="734" y2="580" stroke="#362F4B" stroke-width="1.1"/>
  <line x1="448" y1="624" x2="734" y2="624" stroke="#362F4B" stroke-width="1.1"/>

  <!-- Note box -->
  <rect x="60" y="690" width="696" height="200" rx="14" fill="#F3ECDF" stroke="#D8AF87" stroke-width="1.5"/>
  <text x="90" y="724" font-size="17" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700">Convictions and Curiosity</text>
  <text x="90" y="744" font-size="12.5" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" font-style="italic">Two separate dials, not one.</text>

  <!-- mini dial 1: convictions -->
  <path d="M106,800 A34,34 0 0 1 174,800" fill="none" stroke="#362F4B" stroke-width="3"/>
  <line x1="140" y1="800" x2="120" y2="774" stroke="#362F4B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="140" cy="800" r="3" fill="#362F4B"/>
  <text x="140" y="852" font-size="11.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">convictions</text>

  <!-- mini dial 2: curiosity -->
  <path d="M226,800 A34,34 0 0 1 294,800" fill="none" stroke="#B8763F" stroke-width="3"/>
  <line x1="260" y1="800" x2="284" y2="778" stroke="#B8763F" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="260" cy="800" r="3" fill="#B8763F"/>
  <text x="260" y="852" font-size="11.5" fill="#4A4356" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">curiosity &amp; care</text>

  <text x="340" y="786" font-size="14" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">If your own beliefs and your care for someone ever feel like</text>
  <text x="340" y="808" font-size="14" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">they&#8217;re pulling against each other, remember: these are two</text>
  <text x="340" y="830" font-size="14" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">separate dials. You don&#8217;t have to turn one down to turn</text>
  <text x="340" y="852" font-size="14" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">the other up.</text>

  <!-- footer -->
  <text x="60" y="925" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif">Spiritual Lesson Plans &#183; spirituallessonplans.org</text>
  <text x="756" y="925" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="end">Free to use, adapt, and share &#183; CC BY-SA 4.0</text>
</svg>
