<!DOCTYPE html>
<html lang="en">
<head>

<title>Main Character Energy — Spiritual Lesson Plans</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23E8A94C%22/></svg>">
<style>
  :root{ --cream:#FBF5EA; --gold:#E8A94C; --ink:#362F4B; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:#EAE2D2;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .toolbar{
    width:100%;
    background:var(--ink);
    color:var(--cream);
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .toolbar a{ color:var(--cream); text-decoration:none; font-size:14px; opacity:.85; }
  .toolbar a:hover{ opacity:1; text-decoration:underline; }
  .toolbar button{
    background:var(--gold);
    color:#3B2A0E;
    border:none;
    border-radius:4px;
    padding:9px 18px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .toolbar button:hover{ filter:brightness(1.05); }
  .sheet-wrap{ padding:28px 16px 44px; width:100%; display:flex; justify-content:center; }
  .sheet{
    background:#fff;
    box-shadow:0 12px 40px rgba(0,0,0,.18);
    width:816px;
    max-width:100%;
  }
  .sheet svg{ display:block; width:100%; height:auto; }
  @media print {
    .toolbar{ display:none; }
    body{ background:#fff; min-height:0; }
    .sheet-wrap{ padding:0; }
    .sheet{ box-shadow:none; width:auto; max-width:none; }
    @page{ size:letter; margin:0; }
  }
</style>

<div class="toolbar">
  <a href="/lessons/trust-the-mover">&larr; Back to the lesson</a>
  <button type="button" onclick="window.print()">Print this handout</button>
</div>
<div class="sheet-wrap">

<svg viewBox="0 0 816 1056" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">

  <text x="60" y="178" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">When a plan falls through, which voice is actually talking?</text>

  <circle cx="466" cy="365" r="15" fill="none" stroke="#B8763F" stroke-width="2"/>
  <text x="496" y="358" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif">I might be needed</text>

  <rect x="426" y="540" width="330" height="90" rx="14" fill="#FFFFFF" stroke="#E4DED0" stroke-width="1.5"/>
