<svg viewBox="0 0 816 1056" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="816" height="1056" fill="#FAF8F5"/>

  <!-- Header -->
  <text x="60" y="70" font-size="12" letter-spacing="2" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="600">A HANDOUT &#183; TRUST THE MOVER</text>
  <text x="60" y="124" font-size="40" fill="#362F4B" font-weight="700">Main Character Energy</text>
  <rect x="60" y="142" width="72" height="4" fill="#B8763F"/>
  <text x="60" y="178" font-size="15" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">When a plan falls through, which voice is actually talking?</text>
  <text x="60" y="200" font-size="13" fill="#8B8496" font-family="Helvetica, Arial, sans-serif">Circle any that sound familiar today. No wrong answers.</text>

  <!-- Column headers -->
  <rect x="60" y="250" width="330" height="50" rx="10" fill="#8B8496"/>
  <text x="225" y="282" font-size="15" fill="#FAF8F5" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.5">MAIN CHARACTER THINKING</text>

  <rect x="426" y="250" width="330" height="50" rx="10" fill="#B8763F"/>
  <text x="591" y="282" font-size="15" fill="#FAF8F5" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.5">TRUSTING THE MOVER</text>

  <!-- Left column items -->
  <rect x="60" y="320" width="330" height="90" rx="14" fill="#FFFFFF" stroke="#E4DED0" stroke-width="1.5"/>
  <circle cx="100" cy="365" r="15" fill="none" stroke="#8B8496" stroke-width="2"/>
  <text x="130" y="358" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif">This was supposed</text>
  <text x="130" y="382" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif">to be about me.</text>

  <rect x="60" y="430" width="330" height="90" rx="14" fill="#FFFFFF" stroke="#E4DED0" stroke-width="1.5"/>
  <circle cx="100" cy="475" r="15" fill="none" stroke="#8B8496" stroke-width="2"/>
  <text x="130" y="468" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif">If it didn&#8217;t happen,</text>
  <text x="130" y="492" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif">I failed.</text>

  <rect x="60" y="540" width="330" height="90" rx="14" fill="#FFFFFF" stroke="#E4DED0" stroke-width="1.5"/>
  <circle cx="100" cy="585" r="15" fill="none" stroke="#8B8496" stroke-width="2"/>
  <text x="130" y="578" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif">Nothing good can happen</text>
  <text x="130" y="602" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif">without me in it.</text>

  <rect x="60" y="650" width="330" height="90" rx="14" fill="#FFFFFF" stroke="#E4DED0" stroke-width="1.5"/>
  <circle cx="100" cy="695" r="15" fill="none" stroke="#8B8496" stroke-width="2"/>
  <text x="130" y="688" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif">I need to know why,</text>
  <text x="130" y="712" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif">right now.</text>

  <!-- Right column items -->
  <rect x="426" y="320" width="330" height="90" rx="14" fill="#FFFFFF" stroke="#E4DED0" stroke-width="1.5"/>
  <circle cx="466" cy="365" r="15" fill="none" stroke="#B8763F" stroke-width="2"/>
  <text x="496" y="358" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif">I might be needed</text>
  <text x="496" y="382" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif">somewhere else.</text>

  <rect x="426" y="430" width="330" height="90" rx="14" fill="#FFFFFF" stroke="#E4DED0" stroke-width="1.5"/>
  <circle cx="466" cy="475" r="15" fill="none" stroke="#B8763F" stroke-width="2"/>
  <text x="496" y="468" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif">A closed door isn&#8217;t</text>
  <text x="496" y="492" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif">proof I failed.</text>

  <rect x="426" y="540" width="330" height="90" rx="14" fill="#FFFFFF" stroke="#E4DED0" stroke-width="1.5"/>
  <circle cx="466" cy="585" r="15" fill="none" stroke="#B8763F" stroke-width="2"/>
  <text x="496" y="578" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif">The good keeps moving,</text>
  <text x="496" y="602" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif">with or without me.</text>

  <rect x="426" y="650" width="330" height="90" rx="14" fill="#FFFFFF" stroke="#E4DED0" stroke-width="1.5"/>
  <circle cx="466" cy="695" r="15" fill="none" stroke="#B8763F" stroke-width="2"/>
  <text x="496" y="688" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif">I don&#8217;t need the whole</text>
  <text x="496" y="712" font-size="14.5" fill="#362F4B" font-family="Helvetica, Arial, sans-serif">reason today.</text>

  <!-- closing -->
  <text x="408" y="800" font-size="16" fill="#B8763F" font-family="Georgia, serif" font-style="italic" text-anchor="middle">Which one&#8217;s actually driving today?</text>

  <!-- footer -->
  <line x1="60" y1="960" x2="756" y2="960" stroke="#E4DED0" stroke-width="1.5"/>
  <text x="60" y="990" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif">Spiritual Lesson Plans &#183; spirituallessonplans.org</text>
  <text x="756" y="990" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="end">Free to use, adapt, and share &#183; CC BY-SA 4.0</text>
</svg>
