<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Map and the Mover — Spiritual Lesson Plans</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23E8A94C%22/></svg>">
<style>
  :root{ --cream:#FBF5EA; --gold:#E8A94C; --ink:#362F4B; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:#EAE2D2;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .toolbar{
    width:100%;
    background:var(--ink);
    color:var(--cream);
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .toolbar a{ color:var(--cream); text-decoration:none; font-size:14px; opacity:.85; }
  .toolbar a:hover{ opacity:1; text-decoration:underline; }
  .toolbar button{
    background:var(--gold);
    color:#3B2A0E;
    border:none;
    border-radius:4px;
    padding:9px 18px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .toolbar button:hover{ filter:brightness(1.05); }
  .sheet-wrap{ padding:28px 16px 44px; width:100%; display:flex; justify-content:center; }
  .sheet{
    background:#fff;
    box-shadow:0 12px 40px rgba(0,0,0,.18);
    width:816px;
    max-width:100%;
  }
  .sheet svg{ display:block; width:100%; height:auto; }
  @media print {
    .toolbar{ display:none; }
    body{ background:#fff; min-height:0; }
    .sheet-wrap{ padding:0; }
    .sheet{ box-shadow:none; width:auto; max-width:none; }
    @page{ size:letter; margin:0; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <a href="/lessons/trust-the-mover">&larr; Back to the lesson</a>
  <button type="button" onclick="window.print()">Print this handout</button>
</div>
<div class="sheet-wrap">
  <div class="sheet">
<svg viewBox="0 0 816 1056" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="816" height="1056" fill="#FAF8F5"/>

  <!-- Header -->
  <text x="60" y="70" font-size="12" letter-spacing="2" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="600">A VISUAL &#183; TRUST THE MOVER</text>
  <text x="60" y="124" font-size="42" fill="#362F4B" font-weight="700">The Map and the Mover</text>
  <rect x="60" y="142" width="72" height="4" fill="#B8763F"/>

  <!-- map panel -->
  <rect x="60" y="230" width="696" height="560" rx="16" fill="#F3ECDF" stroke="#D8AF87" stroke-width="2"/>

  <!-- start marker -->
  <circle cx="140" cy="670" r="10" fill="#362F4B"/>
  <text x="140" y="700" font-size="12" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">START</text>

  <!-- planned destination X -->
  <line x1="428" y1="368" x2="452" y2="392" stroke="#8B8496" stroke-width="3" stroke-linecap="round"/>
  <line x1="452" y1="368" x2="428" y2="392" stroke="#8B8496" stroke-width="3" stroke-linecap="round"/>
  <text x="440" y="418" font-size="11.5" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">where I thought</text>
  <text x="440" y="434" font-size="11.5" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">this was going</text>

  <!-- dotted plan path, interrupted at roadblock -->
  <path d="M140,670 Q250,600 328,472" fill="none" stroke="#8B8496" stroke-width="3" stroke-dasharray="7,9" stroke-linecap="round"/>

  <!-- roadblock -->
  <path d="M328,448 L308,484 L348,484 Z" fill="#C0524A"/>
  <rect x="325" y="458" width="5" height="14" fill="#FAF8F5"/>
  <circle cx="327.5" cy="478" r="2.6" fill="#FAF8F5"/>
  <text x="328" y="504" font-size="12" fill="#8B8496" font-family="Georgia, serif" font-style="italic" text-anchor="middle">the plan changed here</text>

  <!-- mover path, flowing past the block toward open horizon -->
  <path d="M160,680 C260,715 330,660 385,570 C445,472 510,390 660,318" fill="none" stroke="#B8763F" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M648,300 L666,314 L644,326 Z" fill="#B8763F"/>

  <!-- horizon glow -->
  <circle cx="682" cy="292" r="30" fill="#F4DBB5" opacity="0.85"/>
  <line x1="682" y1="252" x2="682" y2="242" stroke="#D8AF87" stroke-width="2"/>
  <line x1="712" y1="272" x2="722" y2="264" stroke="#D8AF87" stroke-width="2"/>
  <line x1="712" y1="312" x2="722" y2="320" stroke="#D8AF87" stroke-width="2"/>

  <!-- labels -->
  <text x="220" y="560" font-size="14" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" font-weight="700">THE MAP</text>
  <text x="220" y="578" font-size="11.5" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" font-style="italic">(the plan)</text>

  <text x="470" y="530" font-size="14" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="700">THE MOVER</text>
  <text x="470" y="548" font-size="11.5" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-style="italic">(what&#8217;s actually still moving)</text>

  <text x="682" y="335" font-size="12" fill="#8B8496" font-family="Georgia, serif" font-style="italic" text-anchor="middle">still moving &#8594;</text>

  <!-- closing quote -->
  <text x="408" y="840" font-size="17" fill="#362F4B" font-family="Georgia, serif" font-style="italic" text-anchor="middle">&#8220;You don&#8217;t have to know exactly why a plan changed</text>
  <text x="408" y="867" font-size="17" fill="#362F4B" font-family="Georgia, serif" font-style="italic" text-anchor="middle">to trust that something is still moving.&#8221;</text>

  <!-- footer -->
  <text x="60" y="985" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif">Spiritual Lesson Plans &#183; spirituallessonplans.org</text>
  <text x="756" y="985" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="end">Free to use, adapt, and share &#183; CC BY-SA 4.0</text>
</svg>
  </div>
</div>
</body>
</html>
