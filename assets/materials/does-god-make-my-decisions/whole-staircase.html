<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You Don't Need the Whole Staircase — Spiritual Lesson Plans</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23E8A94C%22/></svg>">
<style>
  :root{ --cream:#FBF5EA; --gold:#E8A94C; --ink:#362F4B; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:#EAE2D2;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .toolbar{
    width:100%;
    background:var(--ink);
    color:var(--cream);
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .toolbar a{ color:var(--cream); text-decoration:none; font-size:14px; opacity:.85; }
  .toolbar a:hover{ opacity:1; text-decoration:underline; }
  .toolbar button{
    background:var(--gold);
    color:#3B2A0E;
    border:none;
    border-radius:4px;
    padding:9px 18px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .toolbar button:hover{ filter:brightness(1.05); }
  .sheet-wrap{ padding:28px 16px 44px; width:100%; display:flex; justify-content:center; }
  .sheet{
    background:#fff;
    box-shadow:0 12px 40px rgba(0,0,0,.18);
    width:816px;
    max-width:100%;
  }
  .sheet svg{ display:block; width:100%; height:auto; }
  @media print {
    .toolbar{ display:none; }
    body{ background:#fff; min-height:0; }
    .sheet-wrap{ padding:0; }
    .sheet{ box-shadow:none; width:auto; max-width:none; }
    @page{ size:letter; margin:0; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <a href="/lessons/does-god-make-my-decisions">&larr; Back to the lesson</a>
  <button type="button" onclick="window.print()">Print this handout</button>
</div>
<div class="sheet-wrap">
  <div class="sheet">
<svg viewBox="0 0 816 1056" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <radialGradient id="fog" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF8F5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="816" height="1056" fill="#FAF8F5"/>

  <!-- Header -->
  <text x="60" y="70" font-size="12" letter-spacing="2" fill="#B8763F" font-family="Helvetica, Arial, sans-serif" font-weight="600">A VISUAL &#183; DOES GOD MAKE MY DECISIONS FOR ME?</text>
  <text x="60" y="124" font-size="40" fill="#362F4B" font-weight="700">You Don&#8217;t Need the Whole Staircase</text>
  <rect x="60" y="142" width="72" height="4" fill="#B8763F"/>

  <!-- ground line -->
  <line x1="60" y1="900" x2="720" y2="900" stroke="#362F4B" stroke-width="2"/>

  <!-- staircase steps, ascending right, fading with height -->
  <rect x="90" y="845" width="64" height="55" fill="#362F4B" opacity="1"/>
  <rect x="154" y="790" width="64" height="110" fill="#362F4B" opacity="0.88"/>
  <rect x="218" y="735" width="64" height="165" fill="#362F4B" opacity="0.75"/>
  <rect x="282" y="680" width="64" height="220" fill="#362F4B" opacity="0.58"/>
  <rect x="346" y="625" width="64" height="275" fill="#362F4B" opacity="0.40"/>
  <rect x="410" y="570" width="64" height="330" fill="#362F4B" opacity="0.26"/>
  <rect x="474" y="515" width="64" height="385" fill="#362F4B" opacity="0.16"/>
  <rect x="538" y="460" width="64" height="440" fill="#362F4B" opacity="0.09"/>
  <rect x="602" y="405" width="64" height="495" fill="#362F4B" opacity="0.05"/>

  <!-- fog overlay to soften the upper, unseen steps -->
  <ellipse cx="600" cy="430" rx="240" ry="240" fill="url(#fog)"/>

  <!-- figure standing on the last clearly-visible step -->
  <circle cx="250" cy="723" r="9" fill="#B8763F"/>
  <line x1="250" y1="732" x2="250" y2="735" stroke="#B8763F" stroke-width="2"/>

  <!-- label pointing to the visible step -->
  <line x1="260" y1="720" x2="330" y2="660" stroke="#B8763F" stroke-width="1.5" stroke-dasharray="3,4"/>
  <text x="336" y="655" font-size="15" fill="#362F4B" font-family="Helvetica, Arial, sans-serif" font-weight="700">The next honest step</text>
  <text x="336" y="676" font-size="13" fill="#4A4356" font-family="Helvetica, Arial, sans-serif">This one you can see. That&#8217;s enough.</text>

  <!-- faint label on the fading steps -->
  <text x="610" y="400" font-size="14" fill="#8B8496" font-family="Georgia, serif" font-style="italic" opacity="0.7">the rest isn&#8217;t yours to see yet</text>

  <!-- closing quote -->
  <text x="408" y="965" font-size="17" fill="#362F4B" font-family="Georgia, serif" font-style="italic" text-anchor="middle">&#8220;You don&#8217;t need to see the whole staircase &#8212;</text>
  <text x="408" y="992" font-size="17" fill="#362F4B" font-family="Georgia, serif" font-style="italic" text-anchor="middle">just the next honest step, in the light you actually have right now.&#8221;</text>

  <!-- footer -->
  <text x="60" y="1030" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif">Spiritual Lesson Plans &#183; spirituallessonplans.org</text>
  <text x="756" y="1030" font-size="12" fill="#8B8496" font-family="Helvetica, Arial, sans-serif" text-anchor="end">Free to use, adapt, and share &#183; CC BY-SA 4.0</text>
</svg>
  </div>
</div>
</body>
</html>
