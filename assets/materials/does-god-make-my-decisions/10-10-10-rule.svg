  <line x1="556" y1="386" x2="736" y2="386" stroke="#D8D2E0" stroke-width="1"/>
  <line x1="556" y1="436" x2="736" y2="436" stroke="#D8D2E0" stroke-width="1"/>
  <line x1="556" y1="486" x2="736" y2="486" stroke="#D8D2E0" stroke-width="1"/>
