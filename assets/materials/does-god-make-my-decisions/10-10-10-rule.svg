  <rect x="60" y="280" width="220" height="56" rx="10" fill="#362F4B"/>
  <text x="170" y="308" font-size="15" fill="#FAF8F5" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">IN 10 MINUTES</text>
  <text x="170" y="326" font-size="11.5" fill="#D8AF87" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">how will I feel?</text>
