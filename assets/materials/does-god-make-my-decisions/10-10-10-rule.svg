  <line x1="80" y1="436" x2="260" y2="436" stroke="#D8D2E0" stroke-width="1"/>
  <line x1="80" y1="486" x2="260" y2="486" stroke="#D8D2E0" stroke-width="1"/>
  <line x1="80" y1="536" x2="260" y2="536" stroke="#D8D2E0" stroke-width="1"/>
  <line x1="80" y1="586" x2="260" y2="586" stroke="#D8D2E0" stroke-width="1"/>
  <line x1="80" y1="636" x2="260" y2="636" stroke="#D8D2E0" stroke-width="1"/>
  <line x1="80" y1="686" x2="260" y2="686" stroke="#D8D2E0" stroke-width="1"/>
  <line x1="80" y1="736" x2="260" y2="736" stroke="#D8D2E0" stroke-width="1"/>
  <line x1="80" y1="786" x2="260" y2="786" stroke="#D8D2E0" stroke-width="1"/>
  <line x1="80" y1="836" x2="260" y2="836" stroke="#D8D2E0" stroke-width="1"/>

  <!-- Column 2: 10 months -->
  <rect x="298" y="280" width="220" height="56" rx="10" fill="#362F4B"/>
