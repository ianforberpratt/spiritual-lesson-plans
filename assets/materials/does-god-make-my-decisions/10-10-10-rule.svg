  <text x="60" y="908" font-size="15" fill="#B8763F" font-family="Georgia, serif" font-style="italic">Is fear of judgment doing the deciding here &#8212; or am I?</text>
  <line x1="60" y1="940" x2="756" y2="940" stroke="#362F4B" stroke-width="1.2"/>

