  <line x1="318" y1="486" x2="498" y2="486" stroke="#D8D2E0" stroke-width="1"/>
  <line x1="318" y1="536" x2="498" y2="536" stroke="#D8D2E0" stroke-width="1"/>
  <line x1="318" y1="586" x2="498" y2="586" stroke="#D8D2E0" stroke-width="1"/>
